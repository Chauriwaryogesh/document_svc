<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Service</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN for fallback icons and loader -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom styles for Gmail-like UI and animations */
        .email-list-item:hover {
            background-color: #f1f5f9;
            cursor: pointer;
            transform: scale(1.02);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .sidebar-item:hover {
            background-color: #e8f0fe;
            transform: translateX(5px);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .sidebar-item.active {
            background-color: #dbeafe;
            font-weight: bold;
        }
        .compose-window, .image-view-modal, .success-modal {
            transition: all 0.3s ease;
        }
        .compose-window.show, .image-view-modal.show, .success-modal.show {
            animation: fadeIn 0.3s ease forwards;
        }
        /* Button pulse animation */
        .btn-pulse:hover {
            animation: pulse 0.5s ease infinite;
            transform: scale(1.05);
            transition: transform 0.2s ease;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        /* Loader spinner */
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 640px) {
            .sidebar {
                width: 100%;
                position: fixed;
                top: 0;
                left: -100%;
                transition: left 0.3s ease;
            }
            .sidebar.open {
                left: 0;
            }
            .header-nav {
                flex-wrap: wrap;
            }
            .compose-window .modal-content, .image-view-modal .modal-content, .success-modal .modal-content {
                width: 90%;
            }
        }
                .custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .custom-alert-overlay.active {
            display: flex;
        }

        .custom-alert-box {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            min-width: 300px;
            max-width: 80%;
        }

        .custom-alert-header {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .custom-alert-header.error {
            color: #f44336;
        }

        .custom-alert-message {
            color: #555;
            margin-bottom: 15px;
        }

        .custom-alert-message.error {
            color: #f44336;
        }

        .custom-alert-buttons button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .custom-alert-buttons button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans flex flex-col min-h-screen">
<!-- Move customErrorOverlay here -->
    <div id="customErrorOverlay" class="custom-alert-overlay error">
        <div id="customErrorBox" class="custom-alert-box">
            <div id="customErrorHeader" class="custom-alert-header error">Error</div>
            <div id="customErrorMessage" class="custom-alert-message error"></div>
            <div class="custom-alert-buttons">
                <button id="customErrorOkBtn">OK</button>
            </div>
        </div>
    </div>
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow p-4 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button id="menu-toggle" class="sm:hidden text-white text-2xl">☰</button>
            <img src="/images/email-logo.png" alt="Email Service Logo" class="h-8" onerror="this.src=''; this.outerHTML='<i class="fas fa-envelope fa-2x text-white\"></i>'">
        </div>
        <div class="flex-1 max-w-2xl mx-4">
            <input type="text" placeholder="Search mail" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300">
        </div>
        <div class="header-nav flex items-center space-x-4">
            <a href="/contact" class="hover:underline">Contact Us</a>
            <button id="notification-btn" class="relative btn-pulse">
                <i class="fas fa-bell"></i>
                <span id="notification-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
            </button>
            <div class="relative group">
                <button class="flex items-center space-x-2">
                    <span id="user-id">Loading...</span>
                    <img src="/images/user-avatar.png" alt="User Avatar" class="h-8 w-8 rounded-full" onerror="this.src=''; this.outerHTML='<i class=\"fas fa-user-circle fa-2x text-white\"></i>'">
                </button>
                <div class="absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-lg hidden group-hover:block z-50">
                    <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profile</a>
                    <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Settings</a>
                    <a href="#" id="logout-btn" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1">
        <!-- Sidebar -->
        <div class="sidebar w-64 bg-white shadow-md flex flex-col p-4">
            <button id="compose-btn" class="mb-4 bg-blue-600 text-white px-4 py-2 rounded-lg btn-pulse">Compose</button>
            <div class="flex-1 space-y-2">
                <div class="sidebar-item px-4 py-2 text-gray-700 font-semibold bg-blue-100 rounded-lg border-b border-gray-200 active" data-folder="inbox">Inbox</div>
                <div class="sidebar-item px-4 py-2 text-gray-700 border-b border-gray-200" data-folder="sent">Sent</div>
                <div class="sidebar-item px-4 py-2 text-gray-700 border-b border-gray-200" data-folder="drafts">Drafts</div>
                <div class="sidebar-item px-4 py-2 text-gray-700 border-b border-gray-200" data-folder="trash">Trash</div>
            </div>
        </div>

        <!-- Email List -->
        <div class="flex-1 flex flex-col">
            <div id="email-list" class="flex-1 overflow-y-auto p-4 bg-white">
                <div class="email-list-item flex items-center p-3 border-b" data-email-id="1" data-folder="inbox">
                    <input type="checkbox" class="mr-3">
                    <div class="flex-1">
                        <div class="font-semibold">Sender Name</div>
                        <div class="text-gray-600">Subject: Welcome to our service</div>
                        <div class="text-gray-500 text-sm">May 10, 2025</div>
                        <div class="mt-1">
                            <span class="text-blue-600 cursor-pointer view-attachment" data-attachment-id="1" data-filename="sample.png" data-type="image/png">sample.png</span>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button class="delete-btn text-red-600 hover:text-red-800" title="Delete"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <!-- More email items will be populated dynamically -->
            </div>
        </div>

        <!-- Compose Window (Centered Modal) -->
        <div id="compose-window" class="compose-window hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="modal-content bg-white shadow-lg rounded-lg w-full max-w-lg p-4">
                <div class="bg-gray-200 p-2 flex justify-between">
                    <span>New Message</span>
                    <button id="close-compose" class="text-gray-700">✕</button>
                </div>
                <form id="email-form" class="p-4">
                    <input type="email" id="to" placeholder="To" class="w-full p-2 mb-2 border rounded" required>
                    <input type="text" id="subject" placeholder="Subject" class="w-full p-2 mb-2 border rounded">
                    <textarea id="body" placeholder="Message" class="w-full p-2 mb-2 border rounded h-40"></textarea>
                    <div class="flex items-center space-x-2 mb-2">
                        <input type="file" id="attachment" class="text-sm text-gray-700">
                        <button type="submit" id="send-btn" class="bg-blue-600 text-white px-4 py-2 rounded btn-pulse flex items-center">
                            <span id="send-text">Send</span>
                            <span id="send-loader" class="loader hidden ml-2"></span>
                        </button>
                        <button type="button" id="save-draft-btn" class="bg-gray-600 text-white px-4 py-2 rounded btn-pulse flex items-center">
                            <span id="draft-text">Save as Draft</span>
                            <span id="draft-loader" class="loader hidden ml-2"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Image View Popup (Hidden by default) -->
        <div id="image-view-modal" class="image-view-modal hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
            <div class="modal-content bg-white rounded-lg p-4 max-w-3xl w-full">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold">View Image</h3>
                    <button id="close-image-modal" class="text-gray-700 text-xl">✕</button>
                </div>
                <p id="image-error" class="text-red-500 text-sm hidden">Failed to load image.</p>
                <img id="view-image" src="" alt="Attachment Image" class="max-w-full max-h-[60vh] rounded-lg mb-4 object-contain hidden">
                <div class="flex justify-center space-x-4">
                    <button id="download-button" class="bg-blue-600 text-white px-4 py-2 rounded btn-pulse" disabled>Download</button>
                    <button id="full-size-button" class="bg-gray-600 text-white px-4 py-2 rounded btn-pulse" disabled>View Full Size</button>
                </div>
            </div>
        </div>

        <!-- Success Popup (Hidden by default) -->
        <div id="success-modal" class="success-modal hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
            <div class="modal-content bg-white rounded-lg p-6 max-w-sm w-full">
                <h3 class="text-lg font-semibold mb-4" id="success-title">Email Sent Successfully</h3>
                <p class="text-gray-600 mb-4" id="success-message">Your email has been sent.</p>
                <div class="flex justify-center">
                    <button id="success-ok-btn" class="bg-blue-600 text-white px-4 py-2 rounded btn-pulse">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-blue-800 text-white p-4 mt-auto">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center">
            <div class="mb-2 sm:mb-0">Mail Services © 2025. Powered by xAI.</div>
            <div class="flex space-x-4">
                <a href="/help" class="hover:underline">Help</a>
                <a href="/support" class="hover:underline">Support</a>
                <a href="/about" class="hover:underline">About</a>
            </div>
        </div>
    </footer>

    <script>
        // Get user ID from sessionStorage
        function getuserCode() {
            const userCode = sessionStorage.getItem('userCode');
            if (!userCode) {
            	 showErrorAlert('User ID not found. Please log in again.');
                window.location.href = 'login';
                return null;
            }
            return userCode;
        }
        function showErrorAlert(message) {
            const overlay = document.getElementById('customErrorOverlay');
            document.getElementById('customErrorMessage').textContent = message;
            overlay.classList.add('active');
            document.getElementById('customErrorOkBtn').onclick = () => overlay.classList.remove('active');
        }

        // Logout function
        function logout() {
            console.log('Logging out');
            sessionStorage.removeItem('userCode');
            window.location.href = 'login';
        }

        // Fetch notification count
        async function fetchNotificationCount() {
            try {
                console.log('Fetching notification count');
                const userCode = getuserCode();       
                if (!userCode) return;

                const response = await fetch(`/Security/get-notifications?userCode=${encodeURIComponent(userCode)}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `userCode`,
                    },
                });

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('Notification count:', data.unreadCount);
                const countSpan = document.getElementById('notification-count');
                if (data.unreadCount > 0) {
                    countSpan.textContent = data.unreadCount;
                    countSpan.classList.remove('hidden');
                } else {
                    countSpan.classList.add('hidden');
                }
            } catch (error) {
                console.error('Error fetching notification count:', error);
                document.getElementById('notification-count').classList.add('hidden');
            }
        }

        // Toggle sidebar on mobile
        document.getElementById('menu-toggle').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.toggle('open');
        });

        // Show/hide compose window with animation
        const composeBtn = document.getElementById('compose-btn');
        const composeWindow = document.getElementById('compose-window');
        const closeCompose = document.getElementById('close-compose');

        composeBtn.addEventListener('click', () => {
            console.log('Toggling compose window');
            if (composeWindow.classList.contains('hidden')) {
                composeWindow.classList.remove('hidden');
                composeWindow.classList.add('show');
                document.getElementById('email-form').dataset.emailId = '';
            } else {
                composeWindow.classList.remove('show');
                composeWindow.classList.add('hidden');
            }
        });

        closeCompose.addEventListener('click', () => {
            console.log('Closing compose window');
            composeWindow.classList.remove('show');
            composeWindow.classList.add('hidden');
            document.getElementById('email-form').reset();
            document.getElementById('email-form').dataset.emailId = '';
        });

        // Handle email sending with loader
        document.getElementById('email-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const sendBtn = document.getElementById('send-btn');
            const sendText = document.getElementById('send-text');
            const sendLoader = document.getElementById('send-loader');
            const to = document.getElementById('to').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;
            const attachment = document.getElementById('attachment').files[0];
            const userCode = getuserCode();
          
            if (!userCode) return;

            // Show loader
            sendBtn.disabled = true;
            sendText.classList.add('hidden');
            sendLoader.classList.remove('hidden');
            console.log('Sending email to:', to);

            const formData = new FormData();
            formData.append('to', to);
            formData.append('subject', subject);
            formData.append('body', body);
            formData.append('userCode', userCode);
            if (attachment) {
                formData.append('attachment', attachment);
            }

            try {
                const response = await fetch('/Security/send-email', {
                    method: 'POST',
                    headers: {
                        'Authorization': ` ${userCode}`,
                    },
                    body: formData,
                });

                sendBtn.disabled = false;
                sendText.classList.remove('hidden');
                sendLoader.classList.add('hidden');

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }

                if (response.ok) {
                    console.log('Email sent successfully');
                    const successModal = document.getElementById('success-modal');
                    document.getElementById('success-title').textContent = 'Email Sent Successfully';
                    document.getElementById('success-message').textContent = 'Your email has been sent.';
                    successModal.classList.remove('hidden');
                    successModal.classList.add('show');
                } else {
                    alert('Failed to send email. Please try again.');
                }
            } catch (error) {
                console.error('Error sending email:', error);
                sendBtn.disabled = false;
                sendText.classList.remove('hidden');
                sendLoader.classList.add('hidden');
                alert('An error occurred. Please try again.');
            }
        });

        // Handle save as draft
        document.getElementById('save-draft-btn').addEventListener('click', async () => {
            const draftBtn = document.getElementById('save-draft-btn');
            const draftText = document.getElementById('draft-text');
            const draftLoader = document.getElementById('draft-loader');
            const to = document.getElementById('to').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;
            const attachment = document.getElementById('attachment').files[0];
            const emailId = document.getElementById('email-form').dataset.emailId;
            const userCode = getuserCode();
            if (!userCode) return;

            draftBtn.disabled = true;
            draftText.classList.add('hidden');
            draftLoader.classList.remove('hidden');
            console.log('Saving draft for emailId:', emailId || 'new');

            const formData = new FormData();
            formData.append('to', to);
            formData.append('subject', subject);
            formData.append('body', body);
            formData.append('userCode', userCode);
            if (attachment) {
                formData.append('attachment', attachment);
            }
            if (emailId) {
                formData.append('emailId', emailId);
            }

            try {
                const response = await fetch('/Security/save-draft', {
                    method: 'POST',
                    headers: {
                        'Authorization': `${userCode}`,
                    },
                    body: formData,
                });

                draftBtn.disabled = false;
                draftText.classList.remove('hidden');
                draftLoader.classList.add('hidden');

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }

                if (response.ok) {
                    console.log('Draft saved successfully');
                    const successModal = document.getElementById('success-modal');
                    document.getElementById('success-title').textContent = 'Draft Saved Successfully';
                    document.getElementById('success-message').textContent = 'Your draft has been saved.';
                    successModal.classList.remove('hidden');
                    successModal.classList.add('show');
                } else {
                    alert('Failed to save draft. Please try again.');
                }
            } catch (error) {
                console.error('Error saving draft:', error);
                draftBtn.disabled = false;
                draftText.classList.remove('hidden');
                draftLoader.classList.add('hidden');
                alert('An error occurred. Please try again.');
            }
        });

        // Handle success popup OK button
        document.getElementById('success-ok-btn').addEventListener('click', () => {
            console.log('Closing success popup');
            const successModal = document.getElementById('success-modal');
            successModal.classList.remove('show');
            successModal.classList.add('hidden');
            // Close compose window and reset form
            composeWindow.classList.remove('show');
            composeWindow.classList.add('hidden');
            document.getElementById('email-form').reset();
            document.getElementById('email-form').dataset.emailId = '';
            fetchEmails(document.querySelector('.sidebar-item.active').dataset.folder);
        });

        // Notification button (mocked)
        document.getElementById('notification-btn').addEventListener('click', () => {
            console.log('Notification button clicked');
            alert('Notifications panel (to be implemented)');
        });

        // Image view modal functions
        function openImageViewModal(imageUrl, attachmentId, filename) {
            console.log('Opening image view modal for attachmentId:', attachmentId, 'filename:', filename, 'imageUrl:', imageUrl);
            const modal = document.getElementById('image-view-modal');
            const image = document.getElementById('view-image');
            const errorMessage = document.getElementById('image-error');
            const downloadButton = document.getElementById('download-button');
            const fullSizeButton = document.getElementById('full-size-button');

            image.classList.add('hidden');
            errorMessage.classList.add('hidden');
            downloadButton.disabled = true;
            fullSizeButton.disabled = true;

            image.src = imageUrl;
            image.onerror = () => {
                console.error('Failed to load image for attachmentId:', attachmentId);
                errorMessage.textContent = 'Failed to load image.';
                errorMessage.classList.remove('hidden');
            };
            image.onload = () => {
                console.log('Image loaded successfully for attachmentId:', attachmentId);
                image.classList.remove('hidden');
                downloadButton.disabled = false;
                fullSizeButton.disabled = false;
            };

            modal.classList.remove('hidden');
            modal.classList.add('show');
            modal.dataset.attachmentId = attachmentId;
            modal.dataset.filename = filename || `attachment_${attachmentId}`;
        }

        function closeImageViewModal() {
            console.log('Closing image view modal');
            const modal = document.getElementById('image-view-modal');
            const image = document.getElementById('view-image');
            if (image.src) {
                URL.revokeObjectURL(image.src);
            }
            image.src = '';
            image.classList.add('hidden');
            document.getElementById('image-error').classList.add('hidden');
            modal.classList.remove('show');
            modal.classList.add('hidden');
            modal.dataset.attachmentId = '';
            modal.dataset.filename = '';
        }

        function downloadImage() {
            const modal = document.getElementById('image-view-modal');
            const attachmentId = modal.dataset.attachmentId;
            const filename = modal.dataset.filename;
            const imageUrl = document.getElementById('view-image').src;

            console.log('Downloading image for attachmentId:', attachmentId, 'filename:', filename);
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function viewFullSize() {
            const modal = document.getElementById('image-view-modal');
            const attachmentId = modal.dataset.attachmentId;
            console.log('Viewing full size for attachmentId:', attachmentId);
            viewAttachmentInNewTab(attachmentId);
        }

        // Fetch emails and populate the email list
        async function fetchEmails(folder = 'inbox') {
            try {
                console.log(`Fetching emails for folder: ${folder}`);
                const userCode = getuserCode();
               
                if (!userCode) return;

                const endpoint = folder === 'trash' ? '/Security/get-deleted' : '/Security/get-emails';
                const response = await fetch(`${endpoint}?userCode=${encodeURIComponent(userCode)}&folder=${folder}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `${userCode}`,
                    },
                });

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const emails = await response.json();
                console.log(`Emails fetched for ${folder}:`, emails);
                const emailList = document.getElementById('email-list');
                emailList.innerHTML = '';

                emails.forEach(email => {
                    const emailItem = document.createElement('div');
                    emailItem.className = 'email-list-item flex items-center p-3 border-b';
                    emailItem.dataset.emailId = email.id;
                    emailItem.dataset.folder = email.folder || folder;
                    emailItem.innerHTML = `
                        <input type="checkbox" class="mr-3">
                        <div class="flex-1">
                            <div class="font-semibold">${email.sender || 'Unknown Sender'}</div>
                            <div class="text-gray-600">Subject: ${email.subject || 'No Subject'}</div>
                            <div class="text-gray-500 text-sm">${email.date || 'Unknown Date'}</div>
                            <div class="mt-1">
                                ${email.attachments ? email.attachments.map(att => `
                                    <span class="text-blue-600 cursor-pointer view-attachment" 
                                          data-attachment-id="${att.id}" 
                                          data-filename="${att.filename}" 
                                          data-type="${att.type}">${att.filename}</span>
                                `).join(', ') : ''}
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            ${folder === 'trash' ? `
                                <button class="recover-btn text-green-600 hover:text-green-800" title="Recover"><i class="fas fa-undo"></i></button>
                            ` : `
                                <button class="delete-btn text-red-600 hover:text-red-800" title="Delete"><i class="fas fa-trash"></i></button>
                            `}
                        </div>
                    `;
                    emailList.appendChild(emailItem);
                });

                // Add event listeners
                document.querySelectorAll('.view-attachment').forEach(button => {
                    button.addEventListener('click', () => {
                        const attachmentId = button.dataset.attachmentId;
                        const filename = button.dataset.filename;
                        const type = button.dataset.type;
                        viewAttachment(attachmentId, filename, type);
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', () => {
                        const emailId = button.closest('.email-list-item').dataset.emailId;
                        deleteEmail(emailId, folder);
                    });
                });

                document.querySelectorAll('.recover-btn').forEach(button => {
                    button.addEventListener('click', () => {
                        const emailId = button.closest('.email-list-item').dataset.emailId;
                        const originalFolder = button.closest('.email-list-item').dataset.folder;
                        recoverEmail(emailId, originalFolder);
                    });
                });

                document.querySelectorAll('.email-list-item').forEach(item => {
                    if (item.dataset.folder === 'drafts') {
                        item.addEventListener('click', (e) => {
                            if (!e.target.classList.contains('view-attachment') && !e.target.classList.contains('delete-btn')) {
                                editDraft(item.dataset.emailId);
                            }
                        });
                    }
                });
            } catch (error) {
                console.error(`Error fetching emails for ${folder}:`, error);
                document.getElementById('email-list').innerHTML = `<p class="p-4 text-red-500">Failed to load ${folder} emails.</p>`;
            }
        }

        // Delete email
        async function deleteEmail(emailId, folder) {
            try {
                console.log(`Deleting email ${emailId} from ${folder}`);
                const userCode = getuserCode();
               
                if (!userCode ) return;

                const response = await fetch(`/Security/delete-email?emailId=${emailId}&userCode=${encodeURIComponent(userCode)}&folder=${folder}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `${userCode}`,
                    },
                });

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }

                if (response.ok) {
                    console.log(`Email ${emailId} deleted successfully`);
                    fetchEmails(folder);
                } else {
                    alert('Failed to delete email. Please try again.');
                }
            } catch (error) {
                console.error('Error deleting email:', error);
                alert('An error occurred. Please try again.');
            }
        }

        // Recover email
        async function recoverEmail(emailId, originalFolder) {
            try {
                console.log(`Recovering email ${emailId} to ${originalFolder}`);
                const userCode = getuserCode();
              
                if (!userCode ) return;

                const response = await fetch(`/Security/recover-email?emailId=${emailId}&userCode=${encodeURIComponent(userCode)}&folder=${originalFolder}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `${userCode}`,
                    },
                });

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }

                if (response.ok) {
                    console.log(`Email ${emailId} recovered successfully`);
                    fetchEmails('trash');
                } else {
                    alert('Failed to recover email. Please try again.');
                }
            } catch (error) {
                console.error('Error recovering email:', error);
                alert('An error occurred. Please try again.');
            }
        }

        // Edit draft
        async function editDraft(emailId) {
            try {
                console.log(`Fetching draft ${emailId} for editing`);
                const userCode = getuserCode();
            
                if (!userCode) return;

                const response = await fetch(`/Security/get-draft?emailId=${emailId}&userCode=${encodeURIComponent(userCode)}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `${userCode}`,
                    },
                });

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const draft = await response.json();
                console.log('Draft fetched:', draft);
                document.getElementById('to').value = draft.to || '';
                document.getElementById('subject').value = draft.subject || '';
                document.getElementById('body').value = draft.body || '';
                document.getElementById('email-form').dataset.emailId = emailId;
                composeWindow.classList.remove('hidden');
                composeWindow.classList.add('show');
            } catch (error) {
                console.error('Error fetching draft:', error);
                alert('Failed to load draft. Please try again.');
            }
        }

        // View attachment
        async function viewAttachment(attachmentId, filename, type) {
            console.log('viewAttachment called with attachmentId:', attachmentId, 'filename:', filename, 'type:', type);
            try {
                const userCode = getuserCode();
                
                if (!userCode ) return;

                const response = await fetch(`/Security/get-attachment?id=${attachmentId}&userCode=${encodeURIComponent(userCode)}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `${userCode}`,
                    },
                });

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }

                if (!response.ok) {
                    console.error('Fetch attachment failed with status:', response.status);
                    alert('Failed to fetch attachment.');
                    return;
                }

                const contentType = response.headers.get('Content-Type');
                console.log('Content-Type:', contentType);
                const blob = await response.blob();

                const isImageContentType = contentType && contentType.startsWith('image/');
                const isImageExtension = filename && /\.(png|jpg|jpeg)$/i.test(filename);

                if (isImageContentType || isImageExtension) {
                    console.log('Attachment is an image, opening modal');
                    const imageUrl = URL.createObjectURL(blob);
                    openImageViewModal(imageUrl, attachmentId, filename);
                } else {
                    console.log('Attachment is not an image, opening in new tab');
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                }
            } catch (error) {
                console.error('Error viewing attachment:', error);
                alert('An error occurred while viewing the attachment: ' + error.message);
            }
        }

        // View attachment in new tab
        async function viewAttachmentInNewTab(attachmentId) {
            try {
                console.log('Fetching attachment for new tab, attachmentId:', attachmentId);
                const userCode = getuserCode();
               
                if (!userCode ) return;

                const response = await fetch(`/Security/get-attachment?id=${attachmentId}&userCode=${encodeURIComponent(userCode)}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `${userCode}`,
                    },
                });

                if (response.status === 401) {
                    console.warn('Unauthorized, redirecting to login');
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            } catch (error) {
                console.error('Error viewing attachment in new tab:', error);
                alert('An error occurred while viewing the attachment.');
            }
        }

        // Sidebar navigation
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const folder = item.dataset.folder;
                fetchEmails(folder);
            });
        });

        // Initialize event listeners
        document.getElementById('close-image-modal').addEventListener('click', closeImageViewModal);
        document.getElementById('download-button').addEventListener('click', downloadImage);
        document.getElementById('full-size-button').addEventListener('click', viewFullSize);
        document.getElementById('logout-btn').addEventListener('click', logout);

        // Initialize page
        window.onload = async () => {
            const userCode = getuserCode();
            if (userCode) {
                document.getElementById('user-id').textContent = userCode;
                fetchNotificationCount();
                fetchEmails('inbox');
            }
        };
    </script>
</body>
</html>
