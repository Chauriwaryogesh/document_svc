<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Service - My Mailbox</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom styles for Gmail-like UI and animations */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* Light gray background for the whole page */
        }
        .header {
            background-color: #ffffff; /* White header */
            color: #3c4043; /* Dark gray text */
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* Subtle shadow */
            padding: 0.75rem 1.5rem; /* Adjusted padding */
        }
        .search-input {
            background-color: #e8f0fe; /* Light blue background for search */
            border-radius: 9999px; /* Pill-shaped search bar */
            padding: 0.6rem 1rem;
            width: 100%;
            border: none;
            color: #3c4043;
        }
        .search-input::placeholder {
            color: #5f6368;
        }
        .sidebar {
            background-color: #ffffff; /* White sidebar */
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* Subtle shadow */
            width: 18rem; /* Wider sidebar */
            flex-shrink: 0;
            padding: 1rem;
        }
        .compose-btn {
            background-color: #a8d5e5; /* Light blue compose button */
            color: #1a73e8; /* Google blue text */
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
        }
        .compose-btn:hover {
            background-color: #92c0d1; /* Darker blue on hover */
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.1);
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: 0 9999px 9999px 0; /* Rounded right edge */
            font-weight: 500;
            color: #3c4043;
            transition: background-color 0.2s ease;
            margin-right: -1rem; /* Extend to the edge */
            cursor: pointer;
        }
        .sidebar-item:hover {
            background-color: #f1f3f4; /* Light gray on hover */
        }
        .sidebar-item.active {
            background-color: #e8f0fe; /* Google blue light */
            color: #1a73e8; /* Google blue */
            font-weight: 700;
        }
        .email-list-container {
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            margin: 1.5rem;
        }
        .email-list-header {
            border-bottom: 1px solid #e0e0e0;
            padding: 0.75rem 1.5rem;
        }
        .email-list-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        .email-list-item:hover {
            background-color: #f5f5f5; /* Lighter gray on hover */
        }
        .email-list-item.read {
            font-weight: 400; /* Read emails are normal font weight */
        }
        .email-list-item.unread {
            font-weight: 700; /* Unread emails are bold */
        }
        .email-meta {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin-left: 0.5rem;
        }
        .email-sender {
            font-size: 0.95rem;
            color: #202124;
        }
        .email-subject {
            font-size: 0.875rem;
            color: #5f6368;
        }
        .email-date {
            font-size: 0.75rem;
            color: #70757a;
            flex-shrink: 0;
            margin-left: auto;
        }
        .email-actions {
            display: flex;
            gap: 0.5rem;
            opacity: 0; /* Hidden by default */
            transition: opacity 0.2s ease;
        }
        .email-list-item:hover .email-actions {
            opacity: 1; /* Show on hover */
        }
        .action-icon {
            color: #5f6368;
            transition: color 0.2s ease;
        }
        .action-icon:hover {
            color: #202124;
        }

        /* Compose Window */
        .compose-window {
            position: fixed;
            bottom: 0;
            right: 1.5rem; /* Positioned to the bottom right */
            width: 90%;
            max-width: 36rem; /* Standard Gmail compose width */
            background-color: #ffffff;
            border-radius: 0.5rem 0.5rem 0 0; /* Rounded top corners */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        .compose-header {
            background-color: #4285f4; /* Google blue header */
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem 0.5rem 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }
        .compose-body {
            padding: 1rem;
            flex-grow: 1;
        }
        .compose-input {
            width: 100%;
            padding: 0.5rem;
            border: none;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #3c4043;
        }
        .compose-textarea {
            width: 100%;
            padding: 0.5rem;
            border: none;
            min-height: 10rem; /* Taller textarea */
            resize: vertical;
            font-size: 0.875rem;
            color: #3c4043;
        }
        .compose-footer {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e0e0e0;
        }
        .compose-send-btn {
            background-color: #1a73e8; /* Google blue */
            color: white;
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .compose-send-btn:hover {
            background-color: #1565c0; /* Darker blue on hover */
        }

        /* Email Detail Modal */
        .email-detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .email-detail-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .email-detail-content {
            background-color: #ffffff;
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            max-width: 900px; /* Wider for email content */
            width: 90%;
            height: 90%;
            display: flex;
            flex-direction: column;
        }
        .email-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }
        .email-detail-subject {
            font-size: 1.5rem;
            font-weight: 700;
            color: #202124;
            flex-grow: 1;
        }
        .email-detail-close-btn {
            font-size: 1.5rem;
            color: #5f6368;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .email-detail-close-btn:hover {
            color: #202124;
        }
        .email-detail-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .email-detail-sender {
            font-weight: 600;
            color: #202124;
            font-size: 1rem;
        }
        .email-detail-date {
            font-size: 0.85rem;
            color: #5f6368;
        }
        .email-detail-body {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 1rem;
            padding-right: 0.5rem; /* For scrollbar padding */
            line-height: 1.6;
            color: #3c4043;
        }
        .email-detail-attachments {
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
        .email-detail-attachments h4 {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #202124;
        }
        .email-detail-attachment-item {
            display: inline-flex;
            align-items: center;
            background-color: #e8f0fe;
            border-radius: 9999px;
            padding: 0.3rem 0.8rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: #1a73e8;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .email-detail-attachment-item:hover {
            background-color: #d2e3fc;
        }
        .email-detail-actions-bottom {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            justify-content: flex-end; /* Align actions to the right */
        }
        .email-detail-action-btn {
            background-color: #f1f3f4;
            color: #5f6368;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .email-detail-action-btn:hover {
            background-color: #e8eaed;
            color: #202124;
        }


        /* Image View Modal */
        .image-view-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .image-view-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .image-view-content {
            background-color: #ffffff;
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
        }
        .image-view-content img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            margin-bottom: 1rem;
        }

        /* Success Modal */
        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .success-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .success-content {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Loader spinner */
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -18rem; /* Hidden off-screen */
                height: 100%;
                z-index: 100;
                transition: left 0.3s ease-in-out;
            }
            .sidebar.open {
                left: 0; /* Slide in */
            }
            .compose-window {
                right: 0.5rem;
                bottom: 0.5rem;
                width: calc(100% - 1rem);
            }
            .email-detail-content {
                width: 95%;
                height: 95%;
                padding: 1rem;
            }
            .email-detail-subject {
                font-size: 1.25rem;
            }
            .email-detail-meta-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans flex flex-col min-h-screen">
    <!-- Header -->
    <header class="header text-gray-700 shadow p-4 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button id="menu-toggle" class="lg:hidden text-gray-600 text-2xl">☰</button>
            <i class="fas fa-envelope fa-2x text-red-600"></i> <!-- Gmail-like red envelope icon -->
            <span class="text-2xl font-bold text-gray-800 hidden lg:block">Mail Services</span>
        </div>
        <div class="flex-1 max-w-2xl mx-4 relative">
            <input type="text" placeholder="Search mail" class="search-input pl-10">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
        </div>
        <div class="header-nav flex items-center space-x-4">
            <button id="notification-btn" class="relative p-2 rounded-full hover:bg-gray-100 transition-colors">
                <i class="fas fa-bell text-gray-600"></i>
                <span id="notification-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-4 w-4 flex items-center justify-center hidden">0</span>
            </button>
            <div class="relative group">
                <button class="flex items-center space-x-2 p-2 rounded-full hover:bg-gray-100 transition-colors">
                    <span id="user-id" class="text-gray-700">Loading...</span>
                    <i class="fas fa-user-circle fa-2x text-gray-500"></i>
                </button>
                <div class="absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-lg hidden group-hover:block z-50 py-1">
                    <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profile</a>
                    <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Settings</a>
                    <a href="#" id="logout-btn" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1">
        <!-- Sidebar -->
        <div class="sidebar flex flex-col p-4 h-full">
            <button id="compose-btn" class="compose-btn mb-6 flex items-center justify-center space-x-2">
                <i class="fas fa-plus"></i>
                <span>Compose</span>
            </button>
            <div class="flex-1 space-y-1">
                <div class="sidebar-item active" data-folder="inbox">
                    <i class="fas fa-inbox mr-3"></i>Inbox
                </div>
                <div class="sidebar-item" data-folder="sent">
                    <i class="fas fa-paper-plane mr-3"></i>Sent
                </div>
                <div class="sidebar-item" data-folder="drafts">
                    <i class="fas fa-file-alt mr-3"></i>Drafts
                </div>
                <div class="sidebar-item" data-folder="trash">
                    <i class="fas fa-trash-alt mr-3"></i>Trash
                </div>
            </div>
        </div>

        <!-- Email List -->
        <div class="flex-1 flex flex-col p-4">
            <div class="email-list-container flex-1 overflow-y-auto">
                <div class="email-list-header flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <input type="checkbox" id="select-all-checkbox" class="h-5 w-5 text-blue-600 rounded focus:ring-blue-500">
                        <div id="header-bulk-actions" class="flex items-center space-x-2 hidden">
                            <button class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100" title="Archive" id="bulk-archive-btn"><i class="fas fa-archive"></i></button>
                            <button class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100" title="Delete" id="bulk-delete-btn"><i class="fas fa-trash-alt"></i></button>
                            <button class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100" title="Mark as Read" id="bulk-mark-read-btn"><i class="fas fa-envelope-open"></i></button>
                            <button class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100" title="Mark as Unread" id="bulk-mark-unread-btn"><i class="fas fa-envelope"></i></button>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-800" id="current-folder-title">Inbox</h2>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button class="text-gray-500 hover:text-gray-700"><i class="fas fa-sync-alt"></i></button>
                        <button class="text-gray-500 hover:text-gray-700"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>
                <div id="email-list">
                    <!-- Mocked Email Item (now dynamically loaded) -->
                </div>
            </div>
        </div>

        <!-- Compose Window (Centered Modal) -->
        <div id="compose-window" class="compose-window hidden">
            <div class="compose-header">
                <span id="compose-title">New Message</span>
                <button id="close-compose" class="text-white text-xl">✕</button>
            </div>
            <form id="email-form" class="compose-body flex flex-col">
                <input type="email" id="to" placeholder="To" class="compose-input" required>
                <input type="text" id="subject" placeholder="Subject" class="compose-input">
                <textarea id="body" placeholder="Message" class="compose-textarea flex-grow"></textarea>
                <div class="compose-footer">
                    <button type="submit" id="send-btn" class="compose-send-btn flex items-center space-x-2">
                        <span id="send-text">Send</span>
                        <span id="send-loader" class="loader hidden"></span>
                    </button>
                    <button type="button" id="save-draft-btn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-300 transition-colors flex items-center space-x-2">
                        <i class="fas fa-save"></i>
                        <span id="draft-text">Save Draft</span>
                        <span id="draft-loader" class="loader hidden"></span>
                    </button>
                    <input type="file" id="attachment" class="text-sm text-gray-700 w-auto">
                </div>
            </form>
        </div>

        <!-- Email Detail Modal (New) -->
        <div id="email-detail-modal" class="email-detail-modal">
            <div class="email-detail-content">
                <div class="email-detail-header">
                    <div class="flex items-center gap-4">
                         <button id="detail-back-btn" class="text-gray-600 hover:text-gray-800 text-xl"><i class="fas fa-arrow-left"></i></button>
                        <h2 id="email-detail-subject" class="email-detail-subject"></h2>
                    </div>
                    <button id="close-email-detail" class="email-detail-close-btn">✕</button>
                </div>

                <div class="email-detail-meta-row">
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-user-circle text-gray-400 text-2xl"></i>
                        <div>
                            <span id="email-detail-sender" class="email-detail-sender"></span>
                            <div class="text-sm text-gray-500">to <span id="email-detail-to"></span></div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span id="email-detail-date" class="email-detail-date"></span>
                        <button id="email-detail-star-btn" class="text-gray-400 hover:text-yellow-500 text-lg"><i class="far fa-star"></i></button>
                        <button id="email-detail-more-actions" class="text-gray-500 hover:text-gray-700 text-lg"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>

                <div id="email-detail-body" class="email-detail-body">
                    <!-- Email body content goes here -->
                </div>

                <div id="email-detail-attachments" class="email-detail-attachments hidden">
                    <h4>Attachments:</h4>
                    <div id="email-detail-attachment-list">
                        <!-- Attachment items go here -->
                    </div>
                </div>

                <div class="email-detail-actions-bottom">
                    <button id="detail-reply-btn" class="email-detail-action-btn"><i class="fas fa-reply mr-2"></i>Reply</button>
                    <button id="detail-reply-all-btn" class="email-detail-action-btn"><i class="fas fa-reply-all mr-2"></i>Reply All</button>
                    <button id="detail-forward-btn" class="email-detail-action-btn"><i class="fas fa-share mr-2"></i>Forward</button>
                    <button id="detail-delete-btn" class="email-detail-action-btn"><i class="fas fa-trash-alt mr-2"></i>Delete</button>
                    <button id="detail-archive-btn" class="email-detail-action-btn"><i class="fas fa-archive mr-2"></i>Archive</button>
                </div>
            </div>
        </div>

        <!-- Image View Popup (Hidden by default) -->
        <div id="image-view-modal" class="image-view-modal hidden">
            <div class="image-view-content">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">View Image</h3>
                    <button id="close-image-modal" class="text-gray-700 text-xl">✕</button>
                </div>
                <p id="image-error" class="text-red-500 text-sm hidden">Failed to load image.</p>
                <img id="view-image" src="" alt="Attachment Image" class="flex-grow object-contain hidden">
                <div class="flex justify-center space-x-4 mt-4">
                    <button id="download-button" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors" disabled>Download</button>
                    <button id="full-size-button" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors" disabled>View Full Size</button>
                </div>
            </div>
        </div>

        <!-- Success Popup (Hidden by default) -->
        <div id="success-modal" class="success-modal hidden">
            <div class="success-content">
                <h3 class="text-lg font-semibold mb-4" id="success-title">Email Sent Successfully</h3>
                <p class="text-gray-600 mb-4" id="success-message">Your email has been sent.</p>
                <div class="flex justify-center">
                    <button id="success-ok-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 mt-auto text-center text-sm">
        <div class="container mx-auto">
            Mail Services © 2025. Powered by xAI.
        </div>
    </footer>

    <script>
        // Get user ID from sessionStorage
        function getuserCode() {
            const userCode = sessionStorage.getItem('userCode');
            if (!userCode) {
                alert('User ID not found. Please log in again.');
                window.location.href = 'login';
                return null;
            }
            return userCode;
        }

        // Logout function
        function logout() {
            console.log('Logging out');
            sessionStorage.removeItem('userCode');
            window.location.href = 'login';
        }

        // Mock fetch notification count - always returns 1 for demonstration
        async function fetchNotificationCount() {
            const countSpan = document.getElementById('notification-count');
            countSpan.textContent = '1'; // Mock value
            countSpan.classList.remove('hidden');
        }

        // Toggle sidebar on mobile
        document.getElementById('menu-toggle').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.toggle('open');
        });

        // Show/hide compose window with animation
        const composeBtn = document.getElementById('compose-btn');

                    if (folder === 'drafts') {
                        openComposeWindow('editDraft', email);
                    } else {
                        // Open new detail modal
                        openEmailDetailModal(email);
                        // Mark email as read in UI and mock data
                        item.classList.remove('unread');
                        item.classList.add('read');
                        item.querySelector('.email-subject .font-semibold')?.classList.remove('font-semibold');
                        if (email) email.read = true; // Update mock data
                        // Update mark as read/unread button in list
                        const markBtn = item.querySelector('.mark-read-unread-btn i');
                        if (markBtn) {
                            markBtn.classList.remove('fa-envelope');
                            markBtn.classList.add('fa-envelope-open');
                            markBtn.closest('button').title = 'Mark as Unread';
                        }
                    }
                });
            });

            // Individual checkbox change listener
            document.querySelectorAll('.email-item-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (event) => {
                    const emailId = event.target.dataset.emailId;
                    const isChecked = event.target.checked;
                    const currentFolder = document.querySelector('.sidebar-item.active').dataset.folder;
                    const email = mockEmails[currentFolder].find(e => e.id === emailId);
                    if (email) email.selected = isChecked;
                    updateHeaderActionsVisibility();
                });
            });


            // Delete button (individual email)
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation(); // Prevent email item click
                    const emailId = button.dataset.emailId;
                    const currentFolder = document.querySelector('.sidebar-item.active').dataset.folder;
                    
                    let emailIndex = mockEmails[currentFolder].findIndex(e => e.id === emailId);
                    if (emailIndex !== -1) {
                        const [deletedEmail] = mockEmails[currentFolder].splice(emailIndex, 1);
                        deletedEmail.folder = 'trash';
                        deletedEmail.read = true;
                        deletedEmail.selected = false;
                        if (!mockEmails.trash) mockEmails.trash = [];
                        mockEmails.trash.push(deletedEmail);
                        alert(`Mock: Email ID: ${emailId} moved to Trash.`);
                        fetchEmails(currentFolder);
                    } else {
                        alert(`Mock: Email ID: ${emailId} not found for deletion.`);
                    }
                });
            });

            // Archive button (individual email)
            document.querySelectorAll('.archive-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation(); // Prevent email item click
                    const emailId = button.dataset.emailId;
                    const currentFolder = document.querySelector('.sidebar-item.active').dataset.folder;

                    let emailIndex = mockEmails[currentFolder].findIndex(e => e.id === emailId);
                    if (emailIndex !== -1) {
                        const [archivedEmail] = mockEmails[currentFolder].splice(emailIndex, 1);
                        archivedEmail.read = true;
                        archivedEmail.selected = false;
                        if (!mockEmails.archive) mockEmails.archive = [];
                        mockEmails.archive.push(archivedEmail);
                        alert(`Mock: Email ID: ${emailId} archived.`);
                        fetchEmails(currentFolder);
                    } else {
                        alert(`Mock: Email ID: ${emailId} not found for archiving.`);
                    }
                });
            });

            // Mark as Read/Unread button (mocked)
            document.querySelectorAll('.mark-read-unread-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation(); // Prevent email item click
                    const emailItem = button.closest('.email-list-item');
                    const emailId = button.dataset.emailId;
                    const icon = button.querySelector('i');
                    const currentFolder = document.querySelector('.sidebar-item.active').dataset.folder;
                    const email = mockEmails[currentFolder].find(e => e.id === emailId);

                    if (email) {
                        email.read = !email.read; // Toggle read state
                        if (email.read) {
                            emailItem.classList.remove('unread');
                            emailItem.classList.add('read');
                            emailItem.querySelector('.email-subject span:first-child')?.classList.remove('font-semibold');
                            icon.classList.remove('fa-envelope');
                            icon.classList.add('fa-envelope-open');
                            button.title = 'Mark as Unread';
                            alert(`Mock mark as read for email ID: ${emailId}`);
                        } else {
                            emailItem.classList.remove('read');
                            emailItem.classList.add('unread');
                            emailItem.querySelector('.email-subject span:first-child')?.classList.add('font-semibold');
                            icon.classList.remove('fa-envelope-open');
                            icon.classList.add('fa-envelope');
                            button.title = 'Mark as Read';
                            alert(`Mock mark as unread for email ID: ${emailId}`);
                        }
                    }
                });
            });

            // Star button in list (mocked)
            document.querySelectorAll('.email-list-star-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation(); // Prevent email item click
                    const emailId = button.dataset.emailId;
                    const icon = button.querySelector('i') || button; // If icon itself is the button
                    const currentFolder = document.querySelector('.sidebar-item.active').dataset.folder;
                    const email = mockEmails[currentFolder].find(e => e.id === emailId);

                    if (email) {
                        email.starred = !email.starred; // Toggle starred state
                        if (email.starred) {
                            icon.classList.remove('far', 'text-gray-400');
                            icon.classList.add('fas', 'text-yellow-500');
                            alert(`Starred email ID: ${emailId} (mocked)`);
                        } else {
                            icon.classList.remove('fas', 'text-yellow-500');
                            icon.classList.add('far', 'text-gray-400');
                            alert(`Unstarred email ID: ${emailId} (mocked)`);
                        }
                    }
                });
            });

            updateHeaderActionsVisibility(); // Initial call to set visibility
        }
        
        // Initialize event listeners
        document.getElementById('close-image-modal').addEventListener('click', closeImageViewModal);
        document.getElementById('download-button').addEventListener('click', downloadImage);
        document.getElementById('full-size-button').addEventListener('click', viewFullSize);
        document.getElementById('logout-btn').addEventListener('click', logout);

        // Sidebar navigation
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const folder = item.dataset.folder;
                fetchEmails(folder);
            });
        });

        // Initialize page
        window.onload = async () => {
            const userCode = sessionStorage.getItem('userCode') || 'mockUser'; // Use a mock userCode
            sessionStorage.setItem('userCode', userCode); // Ensure it's set for mock purposes
            document.getElementById('user-id').textContent = userCode;
            fetchNotificationCount();
            fetchEmails('inbox');
        };
    </script>
</body>
</html>
