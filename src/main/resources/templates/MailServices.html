<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Service</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for Gmail-like UI and animations */
        .email-list-item:hover {
            background-color: #f1f5f9;
            cursor: pointer;
            transform: scale(1.02);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .sidebar-item:hover {
            background-color: #e8f0fe;
            transform: translateX(5px);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .compose-window {
            transition: all 0.3s ease;
        }
        .compose-window.show {
            animation: slideUp 0.3s ease forwards;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .btn-hover:hover {
            transform: scale(1.05);
            transition: transform 0.2s ease;
        }
        @media (max-width: 640px) {
            .sidebar {
                width: 100%;
                position: fixed;
                top: 0;
                left: -100%;
                transition: left 0.3s ease;
            }
            .sidebar.open {
                left: 0;
            }
            .footer {
                flex-wrap: wrap;
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow p-4 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button id="menu-toggle" class="sm:hidden text-gray-700 text-2xl">☰</button>
            <img src="https://via.placeholder.com/100x40?text=Email+Logo" alt="Email Service Logo" class="h-8">
        </div>
        <div class="flex-1 max-w-2xl mx-4">
            <input type="text" placeholder="Search mail" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="relative group">
            <button class="text-gray-700 flex items-center space-x-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 21v-6a2 2 0 012-2h2a2 2 0 012 2v6"></path>
                </svg>
                <span>User Name</span>
                <img src="https://via.placeholder.com/32" alt="User Avatar" class="h-8 w-8 rounded-full">
            </button>
            <div class="absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-lg hidden group-hover:block">
                <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profile</a>
                <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Settings</a>
                <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Logout</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1">
        <!-- Sidebar -->
        <div class="sidebar w-64 bg-white shadow-md flex flex-col p-4">
            <button id="compose-btn" class="mb-4 bg-blue-600 text-white px-4 py-2 rounded-lg btn-hover">Compose</button>
            <div class="flex-1">
                <div class="sidebar-item px-4 py-2 text-gray-700 font-semibold bg-blue-100 rounded-lg">Inbox</div>
                <div class="sidebar-item px-4 py-2 text-gray-700">Sent</div>
                <div class="sidebar-item px-4 py-2 text-gray-700">Drafts</div>
                <div class="sidebar-item px-4 py-2 text-gray-700">Trash</div>
            </div>
        </div>

        <!-- Email List -->
        <div class="flex-1 flex flex-col">
            <div class="flex-1 overflow-y-auto p-4 bg-white">
                <div class="email-list-item flex items-center p-3 border-b">
                    <input type="checkbox" class="mr-3">
                    <div class="flex-1">
                        <div class="font-semibold">Sender Name</div>
                        <div class="text-gray-600">Subject: Welcome to our service</div>
                    </div>
                    <div class="text-gray-500">May 10, 2025</div>
                </div>
                <!-- Add more email items dynamically via JS if needed -->
            </div>
        </div>

        <!-- Compose Window (Hidden by default) -->
        <div id="compose-window" class="compose-window hidden fixed bottom-0 right-4 w-96 bg-white shadow-lg rounded-t-lg">
            <div class="bg-gray-200 p-2 flex justify-between">
                <span>New Message</span>
                <button id="close-compose" class="text-gray-700">✕</button>
            </div>
            <form id="email-form" class="p-4">
                <input type="email" id="to" placeholder="To" class="w-full p-2 mb-2 border rounded" required>
                <input type="text" id="subject" placeholder="Subject" class="w-full p-2 mb-2 border rounded">
                <textarea id="body" placeholder="Message" class="w-full p-2 mb-2 border rounded h-40"></textarea>
                <div class="flex items-center space-x-2 mb-2">
                    <input type="file" id="attachment" class="text-sm text-gray-700">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded btn-hover">Send</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 mt-auto">
        <div class="container mx-auto flex justify-between items-center">
            <div>© 2025 Email Service. All rights reserved.</div>
            <div class="flex space-x-4">
                <a href="#" class="hover:underline">Terms</a>
                <a href="#" class="hover:underline">Privacy</a>
                <a href="#" class="hover:underline">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        // Toggle sidebar on mobile
        document.getElementById('menu-toggle').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.toggle('open');
        });

        // Show/hide compose window with animation
        const composeBtn = document.getElementById('compose-btn');
        const composeWindow = document.getElementById('compose-window');
        const closeCompose = document.getElementById('close-compose');

        composeBtn.addEventListener('click', () => {
            if (composeWindow.classList.contains('hidden')) {
                composeWindow.classList.remove('hidden');
                composeWindow.classList.add('show');
            } else {
                composeWindow.classList.remove('show');
                composeWindow.classList.add('hidden');
            }
        });

        closeCompose.addEventListener('click', () => {
            composeWindow.classList.remove('show');
            composeWindow.classList.add('hidden');
        });

        // Handle email sending with attachment
        document.getElementById('email-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const to = document.getElementById('to').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;
            const attachment = document.getElementById('attachment').files[0];

            const formData = new FormData();
            formData.append('to', to);
            formData.append('subject', subject);
            formData.append('body', body);
            if (attachment) {
                formData.append('attachment', attachment);
            }

            try {
                const response = await fetch('/EmailService/send-email', {
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    alert('Email sent successfully!');
                    composeWindow.classList.remove('show');
                    composeWindow.classList.add('hidden');
                    document.getElementById('email-form').reset();
                } else {
                    alert('Failed to send email. Please try again.');
                }
            } catch (error) {
                console.error('Error sending email:', error);
                alert('An error occurred. Please try again.');
            }
        });
    </script>
</body>
</html>
