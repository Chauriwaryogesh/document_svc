<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sidebar-width: 250px;
            --sidebar-width-collapsed: 80px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .main-content {
            transition: margin-left 0.3s ease-in-out;
            margin-left: var(--sidebar-width);
        }
        body.sidebar-collapsed .main-content {
            margin-left: var(--sidebar-width-collapsed);
        }
        .sidebar {
            width: var(--sidebar-width);
            transition: width 0.3s ease-in-out;
            background: linear-gradient(180deg, #ffffff, #f0f4f8); /* Stylish gradient */
            box-shadow: 2px 0 10px rgba(0,0,0,0.05); /* Soft shadow */
        }
        body.sidebar-collapsed .sidebar {
            width: var(--sidebar-width-collapsed);
        }
        .sidebar .nav-link span, .sidebar .logo-text {
            transition: opacity 0.2s ease-in-out;
        }
        body.sidebar-collapsed .sidebar .nav-link span,
        body.sidebar-collapsed .sidebar .logo-text {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }
        /* Sidebar toggle button specific styles for collapse/expand text */
        #sidebar-toggle .toggle-text {
            transition: opacity 0.2s ease-in-out;
            margin-left: 0.75rem; /* Space between icon and text */
        }
        body.sidebar-collapsed #sidebar-toggle .toggle-text {
            opacity: 0;
            width: 0;
            overflow: hidden;
            margin-left: 0; /* Remove margin when collapsed */
        }

        .tab-button.active {
            border-color: #4f46e5;
            color: #4f46e5;
            background-color: #eef2ff;
        }
        .summary-circle {
            transition: all 0.3s ease;
        }
        .summary-circle:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .modal-body::-webkit-scrollbar { width: 8px; }
        .modal-body::-webkit-scrollbar-track { background: #f1f1f1; }
        .modal-body::-webkit-scrollbar-thumb { background: #a8a8a8; border-radius: 4px; }
        .modal-body::-webkit-scrollbar-thumb:hover { background: #888; }
        .input-style {
            background-color: #f8fafc; border: 1px solid #d1d5db; color: #1e293b;
            font-size: 0.875rem; border-radius: 0.5rem; padding: 0.5rem 1rem;
            width: 100%; box-sizing: border-box;
        }
        .input-style:focus {
            outline: none; ring: 2px solid #4f46e5; border-color: #4f46e5;
        }
        .complaint-number-link {
            cursor: pointer;
            text-decoration: underline;
            color: #4f46e5;
        }
        .complaint-number-link:hover {
            color: #3730a3;
        }
        #filterComplaintStatus {
            height: auto;
            min-height: 100px;
        }
        .required::after {
            content: '*';
            color: red;
            margin-left: 2px;
        }
        .status-count-circle {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
            line-height: 1;
        }
        .report-flow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding: 1rem;
            background-color: #f8fafc;
            border-radius: 0.75rem;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
            overflow-x: auto;
        }
        .report-flow-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            padding: 0 1rem;
        }
        .report-flow-item:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 25px;
            left: calc(50% + 20px);
            right: calc(-50% + 20px);
            height: 2px;
            background-color: #cbd5e1;
            z-index: 0;
        }
        .report-flow-item.completed .flow-circle {
            background-color: #10b981;
            color: white;
            border-color: #059669;
        }
        .report-flow-item.completed::after {
            background-color: #10b981;
        }
        .report-flow-item.current .flow-circle {
            background-color: #4f46e5;
            color: white;
            border-color: #4338ca;
            transform: scale(1.1);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.3);
        }
        .flow-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #e2e8f0;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid #cbd5e1;
            transition: all 0.3s ease;
            z-index: 1;
        }
        .flow-status-text {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #475569;
            text-align: center;
            white-space: nowrap;
        }
        .report-flow-item.current .flow-status-text {
            color: #4f46e5;
            font-weight: 600;
        }
        /* New styles for modern complaints UI */
        .complaint-card {
            border-left: 5px solid; /* Use status-based border */
            border-radius: 0.75rem;
            padding: 1.5rem;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .complaint-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .complaint-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .complaint-card-title {
            font-weight: 600;
            color: #1e293b;
            font-size: 1.125rem;
        }
        .complaint-card-meta {
            font-size: 0.75rem;
            color: #64748b;
        }
        .complaint-card-description {
            font-size: 0.875rem;
            color: #475569;
            line-height: 1.5;
            flex-grow: 1; /* Allows description to take available space */
        }
        .complaint-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }
        .status-badge {
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .action-buttons-group {
            display: flex;
            gap: 0.75rem;
        }
        .action-buttons-group button {
            padding: 0.5rem;
            border-radius: 0.5rem;
            background-color: #f1f5f9;
            color: #475569;
            transition: background-color 0.2s ease;
        }
        .action-buttons-group button:hover {
            background-color: #e2e8f0;
        }

        /* Table specific styles for modern look */
        .table-header th {
            padding: 1rem 1.5rem;
            background-color: #f8fafc;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
        }
        .table-row td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        .table-row:last-child td {
            border-bottom: none;
        }
        .table-row:hover {
            background-color: #fdfefe;
        }
    </style>
</head>
<body class="sidebar-collapsed">
    <aside class="sidebar h-screen fixed top-0 left-0 z-40 shadow-xl flex flex-col">
        <div class="flex items-center justify-between h-20 border-b border-slate-200 shrink-0 px-4">
             <div class="flex items-center justify-center">
                <i class="fa-solid fa-shield-heart text-indigo-600 text-3xl"></i>
                <span class="logo-text text-xl font-bold text-slate-800 ml-3">Complaints</span>

                <i class="fas fa-bars fa-fw text-lg transition-transform duration-300"></i>

        </div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="#" class="nav-link flex items-center p-3 rounded-lg text-slate-600 bg-indigo-50 text-indigo-700 font-semibold" data-sidebar-action="dashboard">
                <i class="fas fa-tachometer-alt fa-fw text-lg w-12 text-center"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-link flex items-center p-3 rounded-lg text-slate-600 hover:bg-slate-100" data-sidebar-action="all-complaints">
                <i class="fas fa-file-alt fa-fw text-lg w-12 text-center"></i>
                <span>All Complaints</span>
            </a>
            <a href="#" class="nav-link flex items-center p-3 rounded-lg text-slate-600 hover:bg-slate-100" data-sidebar-action="customer-services">
                <i class="fas fa-headset fa-fw text-lg w-12 text-center"></i>
                <span>Customer Services</span>
            </a>
            <a href="#" class="nav-link flex items-center p-3 rounded-lg text-slate-600 hover:bg-slate-100" data-sidebar-action="policy">

                <span>Policy</span>
            </a>
            <a href="#" class="nav-link flex items-center p-3 rounded-lg text-slate-600 hover:bg-slate-100" data-sidebar-action="bank">

                <span>Bank</span>
            </a>
            <a href="#" class="nav-link flex items-center p-3 rounded-lg text-slate-600 hover:bg-slate-100" data-sidebar-action="payments">

                <span>Payments</span>
            </a>
        </nav>
        <div class="p-4 border-t border-slate-200 shrink-0">
            <a href="#" id="logoutSidebarBtn" class="flex items-center p-3 rounded-lg text-red-600 hover:bg-red-100 mt-2">
                <i class="fas fa-sign-out-alt fa-fw text-lg w-12 text-center"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <div class="main-content">
        <header class="bg-white/80 backdrop-blur-lg shadow-sm sticky top-0 z-30">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-20">
                    <h1 class="text-2xl font-bold text-slate-800">Complaints Dashboard</h1>
                    <div class="flex items-center gap-4">
                        <span class="font-semibold text-slate-600 hidden sm:block" id="userNameDisplay">User: Loading...</span>
                        <button id="profileBtn" class="text-slate-500 hover:text-indigo-600 relative">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span id="notificationBadge" class="absolute -top-1 -right-1 hidden h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="p-4 sm:p-6 lg:p-8">
            <div id="complaints-view" class="bg-white rounded-xl shadow-lg">
                <div class="p-4 border-b border-slate-200">
                    <nav class="flex flex-wrap gap-2" aria-label="Tabs">
                       <button class="tab-button py-2 px-4 text-sm font-medium rounded-md border-2 border-transparent relative" data-inputType="All">All Complaints <span id="count-All" class="status-count-circle">0</span></button>
                        <button class="tab-button py-2 px-4 text-sm font-medium rounded-md border-2 border-transparent relative" data-inputType="Open">Open <span id="count-Open" class="status-count-circle">0</span></button>
                        <button class="tab-button py-2 px-4 text-sm font-medium rounded-md border-2 border-transparent relative" data-inputType="Pending">Pending <span id="count-Pending" class="status-count-circle">0</span></button>
                        <button class="tab-button py-2 px-4 text-sm font-medium rounded-md border-2 border-transparent relative" data-inputType="Rejected">Rejected <span id="count-Rejected" class="status-count-circle">0</span></button>
                        <button class="tab-button py-2 px-4 text-sm font-medium rounded-md border-2 border-transparent relative" data-inputType="Reopen">Reopen <span id="count-Reopen" class="status-count-circle">0</span></button>
                        <button class="tab-button py-2 px-4 text-sm font-medium rounded-md border-2 border-transparent relative" data-inputType="Closed">Closed <span id="count-Closed" class="status-count-circle">0</span></button>
                        <button class="tab-button py-2 px-4 text-sm font-medium rounded-md border-2 border-transparent relative" data-inputType="Resolved">Resolved <span id="count-Resolved" class="status-count-circle">0</span></button>                         
                    </nav>
                </div>

                <div class="p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="relative w-full sm:w-72 flex gap-2">
                        <select id="searchTypeSelect" class="input-style w-auto">
                        <option value="complaintNumber">Complaint Number</option>
                            <option value="complaintId">Complaint ID</option>
                            <option value="customerName">Customer Name</option>
                            <option value="policyNumber">Policy Number</option>
                            <option value="workitemNumber">Work Item No.</option>
                        </select>
                        <div class="relative flex-grow">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"><i class="fa fa-search text-slate-400"></i></div>
                            <input type="text" id="searchInput" placeholder="Search..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 bg-slate-50">
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="advancedSearchBtn" class="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600"><i class="fa-solid fa-sliders"></i></button>
                        <button id="viewToggleBtn" class="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600"><i class="fa-solid fa-list"></i></button>
                        <button id="createComplaintBtn" class="flex-shrink-0 bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-indigo-700 transition-colors flex items-center gap-2">
                            <i class="fas fa-plus"></i><span>Create</span>
                        </button>
                    </div>
                </div>

                <div id="bulk-actions-bar" class="hidden p-4 bg-indigo-50 border-y border-indigo-200 flex items-center justify-between">
                    <span id="selection-count" class="font-semibold text-indigo-800">0 selected</span>
                    <button id="delete-selected-btn" class="bg-red-500 text-white font-semibold py-2 px-4 rounded-lg shadow-sm hover:bg-red-600 transition-colors flex items-center gap-2">
                        <i class="fas fa-trash-alt"></i><span>Delete Selected</span>
                    </button>
                </div>

                <div id="display-area" class="p-4"></div>

                <div class="p-4 flex flex-col sm:flex-row items-center justify-between border-t border-slate-200">
                    <span class="text-sm text-slate-700 mb-4 sm:mb-0">
                        Showing <span class="font-semibold" id="pagination-start">0</span>-<span class="font-semibold" id="pagination-end">0</span> of <span class="font-semibold" id="pagination-total">0</span>
                    </span>
                    <div id="pagination-controls" class="flex items-center gap-1"></div>
                </div>
            </div>

            <div id="reports-view" class="bg-white rounded-xl shadow-lg p-8 hidden">
                <h2 class="text-2xl font-bold text-slate-800 mb-4">Reports & Analytics</h2>
                <p class="text-slate-600">Detailed reports and analytics will be available here. Feature coming soon!</p>
            </div>
        </main>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    let allComplaints = [];
    let displayedComplaints = [];
    let selectedComplaintIds = new Set();
    let currentPage = 1;
    const ITEMS_PER_PAGE = 9;
    let currentView = 'cards';
    let currentInputTypeFilter = 'All';
    let userCode = sessionStorage.getItem('userCode');
    console.log(userCode);
    const customerNoFromUrl = new URLSearchParams(window.location.search).get('customerNo');
    console.log(customerNoFromUrl);
    const showErrorToast = (message, bgClass = 'bg-red-600') => {
        const toast = document.createElement('div');
        toast.className = `fixed bottom-5 right-5 ${bgClass} text-white py-3 px-5 rounded-xl shadow-lg z-50 transform transition-all duration-300 translate-y-full opacity-0`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-full', 'opacity-0'), 100);
        setTimeout(() => {
            toast.classList.add('translate-y-full', 'opacity-0');
            toast.addEventListener('transitionend', () => toast.remove());
        }, 4000);
    };
    function getuserCode() {
        if (!userCode) {
            showErrorToast('User ID not found. Please log in again.');
            setTimeout(() => window.location.href = 'login', 1500);
            return null;
        }
        return userCode;
    }
    const mainContent = document.querySelector('.main-content');
    const sidebar = document.querySelector('.sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const displayArea = document.getElementById('display-area');
    const paginationControls = document.getElementById('pagination-controls');
    const searchInput = document.getElementById('searchInput');
    const searchTypeSelect = document.getElementById('searchTypeSelect');
    const viewToggleBtn = document.getElementById('viewToggleBtn');
    const createComplaintBtn = document.getElementById('createComplaintBtn');
    const advancedSearchBtn = document.getElementById('advancedSearchBtn');
    const bulkActionsBar = document.getElementById('bulk-actions-bar');
    const selectionCount = document.getElementById('selection-count');
    const deleteSelectedBtn = document.getElementById('delete-selected-btn');
    const profileBtn = document.getElementById('profileBtn');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const notificationBadge = document.getElementById('notificationBadge');
    const logoutSidebarBtn = document.getElementById('logoutSidebarBtn');

    const complaintsView = document.getElementById('complaints-view');
    const reportsView = document = document.getElementById('reports-view');
    function logout() {
        sessionStorage.removeItem('userCode');
        sessionStorage.removeItem('customerNo'); // Ensure customerNo is also cleared if it was ever stored separately
        userCode = null;
        showErrorToast('You have been successfully logged out.', 'bg-green-500');
        setTimeout(() => {
            window.location.href = 'login'; // Redirect to a dedicated logout page or login
        }, 1500);
    }
    let currentUser = {
        userCode: userCode,
        fullName: 'Guest User',
        roles: [],
        logInTime: 0,
        PhNo:0
    };
    const BASE_URL = 'http://localhost:8081';
    const api = {
        fetchTeamDetails: async () => {
            console.log(userCode);
            if (!userCode) return null;         
            const url = `${BASE_URL}/Complaint/fetch-Team?userCode=${userCode}`;
            try {
                const response = await fetch(url, { headers: { 'userCode': userCode } });
                if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                const data = await response.json();
                return data.data;
            } catch (error) {
                console.error("Failed to fetch team details:", error);
                showErrorToast(`Failed to fetch user details: ${error.message}`);
                return null;
            }
        },
        searchComplaints: async (params = {}) => {
            const queryParams = new URLSearchParams();
            // customerNo will be the same as userCode for this customer's view
            console.log(customerNoFromUrl);
            queryParams.set('customerNo', customerNoFromUrl); 
            Object.entries(params).forEach(([key, value]) => {
                if (value || key === 'type') {
                    if (Array.isArray(value)) {
                        queryParams.set(key, value.join(','));
                    } else {
                        queryParams.set(key, value);
                    }
                }
            });
            const url = `${BASE_URL}/Complaint/search-complaint?${queryParams.toString()}`;
            try {
                const response = await fetch(url, { headers: { 'userCode': userCode } });
                if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                return await response.json();
            } catch (error) {
                showErrorToast(`Search failed: ${error.message}`);
                return { data: [], totalElements: 0 };
            }
        },
        getComplaint: async (complaintNumber, type = '') => {
            const queryParams = new URLSearchParams({ complaintNumber });
            // customerNo will be the same as userCode for this customer's view
            queryParams.set('customerNo', customerNoFromUrl); 
            if (type) queryParams.set('type', type);
            const url = `${BASE_URL}/Complaint/get-complaint?${queryParams.toString()}`;
            try {
                const response = await fetch(url, { headers: { 'userCode': userCode } });
                if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                const result = await response.json();
                return result.data && result.data.length > 0 ? result.data[0] : null;
            } catch (error) {
                console.error("Failed to fetch complaint details:", error);
                showErrorToast(`Failed to fetch complaint details: ${error.message}`);
                return null;
            }
        },
        fetchPolicyDetails: async (policyNo) => {
            if (!policyNo) return null;
            // customerNo will be the same as userCode for this customer's view
            const url = `${BASE_URL}/policy/policy-details?policyNo=${policyNo}&customerNo=${customerNoFromUrl}`; 
            try {
                const response = await fetch(url, { headers: { 'userCode': userCode } });
                if (!response.ok) throw new Error('Policy not found');
                return await response.json();
            } catch (error) {
                showErrorToast(error.message);
                return null;
            }
        },
        createComplaint: async (data) => {
            const url = `${BASE_URL}/Complaint/create-complaint`;
            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 
                        'userCode': userCode,
                        'Content-Type': 'application/json' 
                    }, 
                    // customerNo in body will be the same as userCode
                    body: JSON.stringify({ ...data, action: 'create', customerNo: customerNoFromUrl }) 
                });
                if (!response.ok) { 
                    const errorData = await response.json(); 
                    throw new Error(errorData.errorMessage || 'Failed to create complaint'); 
                }
                const responseData = await response.json();
                showErrorToast("Complaint created successfully!", "bg-green-500");
                return responseData;
            } catch (error) {
                showErrorToast(`Creation failed: ${error.message}`);
                return null;
            }
        },
        updateComplaint: async (data) => {
            const url = `${BASE_URL}/Complaint/create-complaint`;
            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: {
                        'userCode': userCode,
                        'Content-Type': 'application/json' 
                    }, 
                    body: JSON.stringify({ ...data, action: 'update', customerNo: customerNoFromUrl }) 
                });
                if (!response.ok) { 
                    const errorData = await response.json(); 
                    throw new Error(errorData.errorMessage || 'Failed to update complaint'); 
                }
                const responseData = await response.json();
                showErrorToast("Complaint updated successfully!", "bg-green-500");
                return responseData;
            } catch (error) {
                showErrorToast(`Update failed: ${error.message}`);
                return null;
            }
        },
        deleteComplaints: async (ids) => {
            const deletePromises = Array.from(ids).map(id => {
                // customerNo in query will be the same as userCode
                const url = `${BASE_URL}/Complaint/delete-complaint?complaintId=${id}&customerNo=${customerNoFromUrl}`; 
                return fetch(url, { method: 'DELETE', headers: { 'userCode': userCode } });
            });
            try {
                const results = await Promise.all(deletePromises);
                const failed = results.filter(res => !res.ok);
                if (failed.length > 0) throw new Error(`${failed.length} deletions failed.`);
                showErrorToast(`${ids.size} complaint(s) deleted successfully!`, "bg-green-500");
                return { success: true };
            } catch (error) {
                showErrorToast(`Deletion failed: ${error.message}`);
                return { success: false };
            }
        },
    };

    const getSlaInfo = (complaint) => {
        if (!complaint || !complaint.slaDueDate || !complaint.dateFiled) return { isCrossed: false, daysLeft: 'N/A', progress: 0 };
        const slaDueDate = new Date(complaint.slaDueDate);
        const creationDate = new Date(complaint.dateFiled);
        const today = new Date();
        const timeLeft = slaDueDate.getTime() - today.getTime();
        const daysLeft = Math.ceil(timeLeft / (1000 * 3600 * 24));
        const totalDuration = slaDueDate.getTime() - creationDate.getTime();
        if (totalDuration <= 0) return { daysLeft: 0, progress: 100, isCrossed: today > slaDueDate };
        const timePassed = today.getTime() - creationDate.getTime();
        const progress = Math.min(100, Math.max(0, (timePassed / totalDuration) * 100));
        const isCrossed = today > slaDueDate;
        return { daysLeft, progress, isCrossed };
    };

        displayArea.innerHTML = '';

    const createComplaintRow = (complaint) => {

        row.innerHTML = `

    const createComplaintCard = (complaint) => {
        const card = document.createElement('div');

    const getSlaProgressHtml = (complaint, slaInfo) => {
        if (['Resolved', 'Closed', 'Rejected'].includes(complaint.status)) {
            return `<div class="flex items-center gap-2"><div class="sla-circle bg-green-100 text-green-700 text-lg"><i class="fa-solid fa-check"></i></div><span class="font-semibold text-green-600">Met</span></div>`;

        let flowHTML = '<div class="report-flow">';
        let completed = true;

        statusOrder.forEach(status => {
            const isCurrent = status === currentStatus;
            const isCompleted = completed && statusOrder.indexOf(currentStatus) >= statusOrder.indexOf(status);
            
            let iconClass = '';
            switch(status) {
                case 'Open': iconClass = 'fa-folder-open'; break;
                case 'Pending': iconClass = 'fa-hourglass-half'; break;
                case 'Reopen': iconClass = 'fa-redo'; break;
                case 'Resolved': iconClass = 'fa-check-circle'; break;
                case 'Closed': iconClass = 'fa-times-circle'; break;
                case 'Rejected': iconClass = 'fa-ban'; break;
                default: iconClass = 'fa-question-circle';
            }

            flowHTML += `
                <div class="report-flow-item ${isCompleted ? 'completed' : ''} ${isCurrent ? 'current' : ''}">
                    <div class="flow-circle"><i class="fas ${iconClass}"></i></div>
                    <span class="flow-status-text">${status}</span>

            status: document.getElementById('status') ? document.getElementById('status').value : 'Open',
            priority: document.getElementById('priority').value,
            slaDueDate:document.getElementById('slaDueDate').value,
            slaStatus: 'In_SLA',
            slaProgress: 0,
            dateFiled: document.getElementById('dateFiled').value,
            lastUpdated: new Date().toISOString().split('T')[0],
            description: document.getElementById('description').value,
            resolutionNotes: document.getElementById('resolutionNotes').value,
            attachmentPath: 'No',
            createdBy: userCode,
            updatedBy: userCode,
            createdAt: document.getElementById('dateFiled').value,
            updatedAt: new Date().toISOString().split('T')[0],
            assignedTo: document.getElementById('assignedTo').value,
            departmentId: document.getElementById('departmentId').value,
            escalationLevel: document.getElementById('escalationLevel').value,
            relatedComplaintId: document.getElementById('relatedComplaintId').value || '0',
            sourceChannel: document.getElementById('sourceChannel').value,
            severity: document.getElementById('severity').value,
            customerFeedback: document.getElementById('customerFeedback').value,
            isReopened: document.getElementById('isReopened') ? (document.getElementById('isReopened').checked ? 'Yes' : 'No') : 'No',
            tags: document.getElementById('tags').value,
            reason: document.getElementById('reason').value,
            workitemNumber: document.getElementById('workitemNumberDisplay').value === 'Auto-generated' ? null : document.getElementById('workitemNumberDisplay').value,
            reopenComplaintNumber: document.getElementById('isReopened').checked ? document.getElementById('reopenComplaintId').value : null,
            reopenReasonForReopen: document.getElementById('isReopened').checked ? document.getElementById('reopenReasonForReopen').value : null
        };

        for (const key in formData) {
            if (formData[key] === null || formData[key] === '') {
                delete formData[key];
            }
        }

        if (mode === 'edit' && !formData.complaintId) {
            showErrorToast('Error: Complaint ID is required for editing.');
            return;
        }

        const response = mode === 'create' 
            ? await api.createComplaint(formData)
            : await api.updateComplaint(formData);

        if (response && response.status === 'Success') {
            closeModal('complaintModal');
            const successModal = document.getElementById('successPopupModal');
            if (successModal) {
                document.getElementById('successComplaintNumber').textContent = response.data.complaintNumber || 'N/A';
                document.getElementById('successUserCode').textContent = response.data.userCode || 'N/A';
                document.getElementById('successStatus').textContent = response.data.status || 'N/A';
                document.getElementById('successWorkitemNumber').textContent = response.data.workitemNumber || 'N/A';
                document.getElementById('successModalTitle').textContent = `Complaint ${mode === 'create' ? 'Created' : 'Updated'}`;
                openModal('successPopupModal');
            } else {
                showErrorToast(`Complaint ${mode === 'create' ? 'created' : 'updated'} successfully! Complaint Number: ${response.data.complaintNumber}`, 'bg-green-500');
            }
            const updatedComplaint = response.data;
            if (mode === 'create') {
                allComplaints.push(updatedComplaint);
            } else {
                const index = allComplaints.findIndex(c => c.complaintId === complaintId);
                if (index !== -1) {
                    allComplaints[index] = { ...allComplaints[index], ...updatedComplaint };
                }
            }
            displayedComplaints = allComplaints;
            currentPage = 1;
            renderAll();
        } else {
            showErrorToast('Failed to save complaint. Please try again.', 'bg-red-600');
        }
    };

    const applyAdvancedFilter = async () => {
        const form = document.getElementById('advancedFilterForm');
        const formData = new FormData(form);
        const filterParams = {};
        formData.forEach((value, key) => {
            if (key === 'status') {
                if (!filterParams[key]) filterParams[key] = [];
                filterParams[key].push(value);
            } else {
                filterParams[key] = value;
            }
        });
        let type = 'All';
        if (filterParams.status && filterParams.status.length === 1) {
            type = filterParams.status[0];
        } else if (filterParams.status && filterParams.status.length > 1) {
            type = filterParams.status.join(',');
        }
        await performSearch({ ...filterParams, inputType: currentInputTypeFilter, type });
        closeModal('advancedFilterModal');
    };

    const clearAdvancedFilter = () => {
        document.getElementById('advancedFilterForm').reset();
    };

    const openProfileModal = async () => {
        const modal = document.getElementById('profileModal');
        if (!modal) return;

        const profileUserName = document.getElementById('profileUserName');
        const profileUserCode = document.getElementById('profileUserCode');
        const profileRoles = document.getElementById('profileRoles');
        const profilePhNo = document.getElementById('profilePhNo');
        const profilelogInTime = document.getElementById('profilelogInTime');

        const teamDetails = await api.fetchTeamDetails();
        if (teamDetails) {
            currentUser.fullName = teamDetails.name || 'Guest User';
            currentUser.roles = teamDetails.roles || [];
            currentUser.logInTime = teamDetails.loggedInTime || 'N/A';
            currentUser.PhNo = teamDetails.phNo || 'N/A';
        }

        profileUserName.textContent = currentUser.fullName;
        profileUserCode.textContent = userCode || 'N/A';
        profileRoles.textContent = currentUser.roles.length > 0 ? currentUser.roles.join(', ') : 'No roles assigned';
        profilePhNo.textContent = currentUser.PhNo;
        profilelogInTime.textContent = currentUser.logInTime !== 'N/A' ? new Date(currentUser.logInTime).toLocaleString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        }) : 'N/A';

        openModal('profileModal');
    };

    const initialize = async () => {
        // Check if userCode is null or empty
        if (!userCode || userCode.trim() === '' || userCode.trim().toLowerCase() === 'na') {
            showErrorToast('No userCode found. Redirecting to login page.', 'bg-red-600');
            setTimeout(() => window.location.href = 'login', 1500);
            return; // Stop further execution
        }

        // Check if customerNoFromUrl is null or empty
        if (!customerNoFromUrl || customerNoFromUrl.trim() === '' || customerNoFromUrl.trim().toLowerCase() === 'na') {
            showErrorToast('No customerNo found. Redirecting to login page.', 'bg-red-600');
            setTimeout(() => window.location.href = 'login', 1500);
            return; // Stop further execution
        }

        createModals();
        const teamDetails = await api.fetchTeamDetails();
        if (teamDetails) {
            currentUser.fullName = teamDetails.name;
            currentUser.roles = teamDetails.roles;
            currentUser.loggedInTime = teamDetails.loggedInTime || new Date().toISOString().split('T')[0];
            currentUser.PhNo=teamDetails.phNo;
        }
        userNameDisplay.textContent = `User: ${currentUser.fullName} (${userCode})`;
        await performSearch({ inputType: 'All' });
    };

    sidebarToggle.addEventListener('click', () => {
        document.body.classList.toggle('sidebar-collapsed');
        sidebarToggle.querySelector('i').classList.toggle('fa-bars');
        sidebarToggle.querySelector('i').classList.toggle('fa-chevron-right');
    });

    document.querySelectorAll('.nav-link[data-sidebar-action]').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const action = link.dataset.sidebarAction;
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('bg-indigo-50', 'text-indigo-700', 'font-semibold'));
            link.classList.add('bg-indigo-50', 'text-indigo-700', 'font-semibold');

            const pageMap = {
                'customer-services': 'CustomerService',
                'policy': 'CustomerService',
                'bank': 'CustomerService',
                'payments': 'PaymentForCustomer'
            };

            if (pageMap[action]) {
                window.location.href = `${pageMap[action]}?customerNo=${customerNoFromUrl}`;
            } else if (action === 'dashboard' || action === 'all-complaints') {
                complaintsView.classList.remove('hidden');
                reportsView.classList.add('hidden');
            }
        });
    });

    logoutSidebarBtn.addEventListener('click', logout);

    document.querySelectorAll('.tab-button[data-inputType]').forEach(button => {
        button.addEventListener('click', async () => {
            document.querySelectorAll('.tab-button[data-inputType]').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            currentInputTypeFilter = button.getAttribute('data-inputType');
            selectedComplaintIds.clear();
            bulkActionsBar.classList.add('hidden');
            const typeValue = currentInputTypeFilter === 'All' ? 'All' : currentInputTypeFilter;
            await performSearch({ type: typeValue });
        });
    });

    const performSearch = async (params = {}) => {
        const searchParams = { ...params };
        const response = await api.searchComplaints(searchParams);
        allComplaints = response.data || [];
        displayedComplaints = allComplaints;
        currentPage = 1;
        renderAll();
    };

    searchInput.addEventListener('input', async () => {
        const searchValue = searchInput.value.trim();
        const searchType = searchTypeSelect.value;
        if (searchValue) {
            await performSearch({ [searchType]: searchValue, inputType: currentInputTypeFilter });
        } else {
            await performSearch({ inputType: currentInputTypeFilter });
        }
    });

    searchTypeSelect.addEventListener('change', () => {
        searchInput.placeholder = `Search by ${searchTypeSelect.options[searchTypeSelect.selectedIndex].text}...`;
        searchInput.value = '';
        performSearch({ inputType: currentInputTypeFilter });
    });

    viewToggleBtn.addEventListener('click', () => {
        currentView = currentView === 'cards' ? 'list' : 'cards';
        viewToggleBtn.innerHTML = currentView === 'cards' ? '<i class="fa-solid fa-list"></i>' : '<i class="fa-solid fa-grip"></i>';
        renderAll();
    });

    createComplaintBtn.addEventListener('click', () => openModal('complaintModal', 'create'));
    advancedSearchBtn.addEventListener('click', () => openModal('advancedFilterModal'));

    initialize();
});
</script>
</body>
</html>
