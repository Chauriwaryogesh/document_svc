<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" async>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@12.4.0/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/handsontable@12.4.0/dist/handsontable.full.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #6c757d;
            --secondary-dark: #5a6268;
            --error: #dc3545;
            --success: #28a745;
            --background: #f4f4f4;
            --card-bg: #fff;
            --shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --padding: 20px;
            --transition: 0.3s ease;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--padding);
        }

        .charts-container {
            display: flex;
            flex-wrap: nowrap;
            gap: 20px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .chart-box {
            flex: 0 0 250px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            box-shadow: var(--shadow);
            aspect-ratio: 1;
        }

        .chart-box canvas {
            max-width: 100%;
            max-height: 200px;
        }

        .create-controls {
            margin-bottom: 20px;
        }

        .modern-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color var(--transition);
            margin-right: 5px;
        }

        .modern-button.primary {
            background-color: var(--primary);
            color: #fff;
        }

        .modern-button.primary:hover {
            background-color: var(--primary-dark);
        }

        .modern-button.secondary {
            background-color: var(--secondary);
            color: #fff;
        }

        .modern-button.secondary:hover {
            background-color: var(--secondary-dark);
        }

        .modern-button.pdf {
            background-color: #dc3545;
            color: #fff;
        }

        .modern-button.pdf:hover {
            background-color: #c82333;
        }

        .documents-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: var(--padding);
            box-shadow: var(--shadow);
        }

        .document-table {
            width: 100%;
            border-collapse: collapse;
        }

        .document-table th,
        .document-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .document-table th {
            background-color: #f8f9fa;
        }

        .custom-alert-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .custom-alert-overlay.show {
            display: flex;
        }

        .custom-alert {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: var(--padding);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .custom-alert.error {
            border-left: 5px solid var(--error);
        }

        .create-document-modal,
        .view-document-modal {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: var(--padding);
            width: 90vw;
            max-width: 1000px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .create-document-modal h2,
        .view-document-modal h2 {
            margin: 0 0 15px;
            font-size: 20px;
            color: #333;
        }

        .create-document-modal label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        .create-document-modal input,
        .create-document-modal select,
        .create-document-modal textarea,
        .view-document-modal textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .editor-container {
            flex: 1;
            margin-bottom: 15px;
            overflow: auto;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .main-footer {
            text-align: center;
            padding: var(--padding);
            background-color: var(--card-bg);
            margin-top: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="charts-container">
            <div class="chart-box">
                <h3>Storage Usage</h3>
                <canvas id="storageChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Document Types</h3>
                <canvas id="docTypeChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Backup Status</h3>
                <canvas id="backupChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Cost Analysis</h3>
                <canvas id="costChart"></canvas>
            </div>
        </div>

        <div class="create-controls">
            <button id="createDocumentBtn" class="modern-button primary"><i class="fas fa-plus"></i> Create Document</button>
        </div>

        <div class="documents-container">
            <h2>Documents</h2>
            <table class="document-table">
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Size</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="documentList"></tbody>
            </table>
        </div>
    </div>

    <div id="customErrorOverlay" class="custom-alert-overlay error">
        <div class="custom-alert error">
            <h3>Error</h3>
            <p id="errorMessage"></p>
            <button id="errorOkBtn" class="modern-button secondary">OK</button>
        </div>
    </div>

    <div id="customSuccessOverlay" class="custom-alert-overlay">
        <div class="custom-alert">
            <h3>Success</h3>
            <p id="successMessage"></p>
            <button id="successOkBtn" class="modern-button secondary">OK</button>
        </div>
    </div>

    <div id="createDocumentOverlay" class="custom-alert-overlay">
        <div class="create-document-modal">
            <h2>Create Document</h2>
            <form id="createDocumentForm">
                <label for="docName">Document Name</label>
                <input type="text" id="docName" placeholder="Enter document name" required>
                <label for="docType">Document Type</label>
                <select id="docType">
                    <option value="XLS">Excel</option>
                    <option value="PDF">PDF</option>
                    <option value="Word">Word</option>
                    <option value="DAT">DAT</option>
                    <option value="TXT">TXT</option>
                </select>
                <div id="editorContainer" class="editor-container"></div>
                <div class="modal-buttons">
                    <button type="button" id="createDocCancelBtn" class="modern-button secondary">Cancel</button>
                    <button type="submit" id="createDocSaveBtn" class="modern-button primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="viewDocumentOverlay" class="custom-alert-overlay">
        <div class="view-document-modal">
            <h2>View Document</h2>
            <div id="viewDocName" style="margin-bottom: 15px; font-weight: bold;"></div>
            <div id="viewEditorContainer" class="editor-container"></div>
            <div class="modal-buttons">
                <button id="viewDocCloseBtn" class="modern-button secondary">Close</button>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <p>© 2025 Cloud Services. All rights reserved.</p>
    </footer>

    <script>
        // Config
        const config = {
            apiBase: 'http://localhost:8081/NewBusinessController',
            timeout: 5000,
            userId: sessionStorage.getItem('userId') || 'ychouri'
        };

        // Cached DOM
        const elements = {
            documentList: document.getElementById('documentList'),
            errorOverlay: document.getElementById('customErrorOverlay'),
            errorMessage: document.getElementById('errorMessage'),
            successOverlay: document.getElementById('customSuccessOverlay'),
            successMessage: document.getElementById('successMessage'),
            createOverlay: document.getElementById('createDocumentOverlay'),
            docName: document.getElementById('docName'),
            docType: document.getElementById('docType'),
            editorContainer: document.getElementById('editorContainer'),
            viewOverlay: document.getElementById('viewDocumentOverlay'),
            viewDocName: document.getElementById('viewDocName'),
            viewEditorContainer: document.getElementById('viewEditorContainer')
        };

        // Data
        const storageData = { used: 120, total: 1000 };
        const documentTypeData = { Excel: 5, PDF: 3, Word: 2, DAT: 1, TXT: 4 };
        const backupData = { completed: 8, pending: 2 };
        const costData = { compute: 200, storage: 150, network: 50 };
        let documents = [];
        let hotInstance = null;
        let textEditor = null;
        let viewHotInstance = null;
        let viewTextEditor = null;
        let docTypeChartInstance = null;

        // Normalize document type
        function normalizeDocType(type) {
            console.log('Normalizing type:', type);
            if (!type) return 'UNKNOWN';
            const typeMap = {
                'txt': 'TXT',
                'excel': 'XLS',
                'pdf': 'PDF',
                'word': 'Word',
                'dat': 'DAT'
            };
            return typeMap[type.toLowerCase()] || type.toUpperCase();
        }

        // Charts
        function initializeCharts() {
            const storageCtx = document.getElementById('storageChart').getContext('2d');
            new Chart(storageCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Used (GB)', 'Free (GB)'],
                    datasets: [{ data: [storageData.used, storageData.total - storageData.used], backgroundColor: ['#007bff', '#e9ecef'] }]
                },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } }
            });

            const docTypeCtx = document.getElementById('docTypeChart').getContext('2d');
            docTypeChartInstance = new Chart(docTypeCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(documentTypeData),
                    datasets: [{ label: 'Documents', data: Object.values(documentTypeData), backgroundColor: '#007bff' }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });

            const backupCtx = document.getElementById('backupChart').getContext('2d');
            new Chart(backupCtx, {
                type: 'pie',
                data: {
                    labels: ['Completed', 'Pending'],
                    datasets: [{ data: [backupData.completed, backupData.pending], backgroundColor: ['#28a745', '#dc3545'] }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });

            const costCtx = document.getElementById('costChart').getContext('2d');
            new Chart(costCtx, {
                type: 'bar',
                data: {
                    labels: ['Compute', 'Storage', 'Network'],
                    datasets: [{ label: 'Cost ($)', data: [costData.compute, costData.storage, costData.network], backgroundColor: ['#007bff', '#28a745', '#ffc107'] }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        // Alerts
        function showErrorAlert(message) {
            console.error('Error:', message);
            elements.errorMessage.textContent = message;
            elements.errorOverlay.classList.add('show');
        }

        function showSuccessAlert(message) {
            console.log('Success:', message);
            elements.successMessage.textContent = message;
            elements.successOverlay.classList.add('show');
        }

        // API Helper
        async function fetchWithTimeout(url, options) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), config.timeout);
            try {
                console.log('Fetching:', url, options);
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timeoutId);
                console.log('Response:', response.status, response.statusText);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                console.error('Fetch error:', error);
                throw error;
            }
        }

        // PDF Generation
        async function generatePdf(docId) {
            try {
                const response = await fetchWithTimeout(`${config.apiBase}/getDocument?id=${docId}`, {
                    headers: { 'userId': config.userId }
                });
                if (!response.ok) {
                    const text = await response.text();
                    console.error('API error response:', text);
                    throw new Error(`HTTP error! status: ${response.status}, response: ${text}`);
                }
                const doc = await response.json();
                console.log('Fetched document for PDF:', doc);
                doc.type = normalizeDocType(doc.type);

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                pdf.setFontSize(16);
                pdf.text(`Document: ${doc.name} (${doc.type})`, 10, 10);

                if (doc.type === 'XLS' && doc.content) {
                    let data = [];
                    try {
                        data = Array.isArray(doc.content) && doc.content.every(row => Array.isArray(row)) ? doc.content : JSON.parse(doc.content);
                    } catch (e) {
                        console.error('Error parsing XLS content for PDF:', e);
                        //data = [['No data available']];
                    }
                    pdf.autoTable({
                        head: [data[0] || ['Column 1', 'Column 2']],
                        body: data.slice(1) || [],
                        startY: 20
                    });
                } else {
                    const content = doc.content || 'No content available.';
                    pdf.setFontSize(12);
                    pdf.text(content, 10, 20);
                }

                pdf.save(`${doc.name}.pdf`);
                showSuccessAlert('PDF generated successfully!');
            } catch (error) {
                console.error('Error generating PDF:', error);
                showErrorAlert(`Failed to generate PDF: ${error.message}`);
            }
        }

        // Documents
        async function fetchDocuments() {
            if (!config.userId) {
                showErrorAlert('User not authenticated.');
                return;
            }
            try {
                const response = await fetchWithTimeout(`${config.apiBase}/documents`, {
                    headers: { 'userId': config.userId }
                });
                if (!response.ok) {
                    const text = await response.text();
                    console.error('API error response:', text);
                    throw new Error(`HTTP error! status: ${response.status}, response: ${text}`);
                }
                const data = await response.json();
                console.log('Raw API response:', data);
                documents = Array.isArray(data.data) ? data.data.map(doc => ({
                    ...doc,
                    type: normalizeDocType(doc.type)
                })).filter(doc => doc.id && doc.name) : [];
                console.log('Processed documents:', documents);
                if (documents.length === 0) {
                    console.warn('No valid documents found');
                }
                populateDocuments();
                try {
                    updateDocTypeChart();
                } catch (chartError) {
                    console.error('Error updating chart:', chartError);
                    showErrorAlert('Failed to update document type chart.');
                }
            } catch (error) {
                console.error('Error fetching documents:', error);
                showErrorAlert(`Failed to fetch documents: ${error.message}`);
                documents = [];
                populateDocuments();
            }
        }

        function populateDocuments() {
            console.log('Populating documents:', documents);
            elements.documentList.innerHTML = '';
            if (!Array.isArray(documents) || documents.length === 0) {
                elements.documentList.innerHTML = '<tr><td colspan="5">No documents found.</td></tr>';
                return;
            }
            documents.forEach(doc => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="checkbox" class="doc-checkbox" data-id="${doc.id}"></td>
                    <td>${doc.name || 'Untitled'}</td>
                    <td>${doc.type || 'Unknown'}</td>
                    <td>${doc.size || '0.00 MB'}</td>
                    <td>
                        <button class="modern-button primary view-btn" data-id="${doc.id}">View</button>
                        <button class="modern-button pdf pdf-btn" data-id="${doc.id}">Generate PDF</button>
                    </td>
                `;
                elements.documentList.appendChild(row);
            });
            bindViewButtons();
            bindPdfButtons();
        }

        function bindViewButtons() {
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.removeEventListener('click', viewDocument);
                btn.addEventListener('click', () => viewDocument(btn.dataset.id));
            });
        }

        function bindPdfButtons() {
            document.querySelectorAll('.pdf-btn').forEach(btn => {
                btn.removeEventListener('click', generatePdf);
                btn.addEventListener('click', () => generatePdf(btn.dataset.id));
            });
        }

        async function viewDocument(docId) {
            if (!config.userId) {
                showErrorAlert('User not authenticated.');
                return;
            }
            try {
                const response = await fetchWithTimeout(`${config.apiBase}/getDocument?id=${docId}`, {
                    headers: { 'userId': config.userId }
                });
                if (!response.ok) {
                    const text = await response.text();
                    console.error('API error response:', text);
                    throw new Error(`HTTP error! status: ${response.status}, response: ${text}`);
                }
                const doc = await response.json();
                console.log('Fetched document:', doc);
                doc.type = normalizeDocType(doc.type);
                showViewDocumentModal(doc);
            } catch (error) {
                console.error('Error fetching document:', error);
                showErrorAlert(`Failed to fetch document: ${error.message}`);
            }
        }

        function showViewDocumentModal(doc) {
            console.log('Showing document:', doc);
            elements.viewDocName.textContent = `Document: ${doc.name} (${doc.type})`;
            elements.viewEditorContainer.innerHTML = '';
            if (viewHotInstance) {
                try {
                    viewHotInstance.destroy();
                } catch (e) {
                    console.warn('Error destroying viewHotInstance:', e);
                }
                viewHotInstance = null;
            }
            if (viewTextEditor) {
                elements.viewEditorContainer.removeChild(viewTextEditor);
                viewTextEditor = null;
            }
            if (doc.type === 'XLS') {
                const hotContainer = document.createElement('div');
                elements.viewEditorContainer.appendChild(hotContainer);
                let data = Handsontable.helper.createSpreadsheetData(10, 10);
                if (doc.content) {
                    try {
                        data = Array.isArray(doc.content) && doc.content.every(row => Array.isArray(row)) ? doc.content : JSON.parse(doc.content);
                        if (!Array.isArray(data) || !data.every(row => Array.isArray(row))) {
                            throw new Error('Invalid XLS content format');
                        }
                    } catch (e) {
                        console.error('Error parsing XLS content:', e, doc.content);
                        showErrorAlert('Invalid Excel content format. Using default data.');
                    }
                } else {
                    console.warn('XLS content is null, using default data');
                }
                console.log('XLS data:', data);
                viewHotInstance = new Handsontable(hotContainer, {
                    data,
                    rowHeaders: true,
                    colHeaders: true,
                    contextMenu: true,
                    width: '100%',
                    height: '100%',
                    stretchH: 'all',
                    readOnly: true,
                    licenseKey: 'non-commercial-and-evaluation'
                });
            } else if (doc.type === 'PDF') {
                viewTextEditor = document.createElement('textarea');
                viewTextEditor.value = doc.content || 'PDF content not displayable. Download required.';
                viewTextEditor.readOnly = true;
                elements.viewEditorContainer.appendChild(viewTextEditor);
                console.log('PDF content:', doc.content);
            } else {
                viewTextEditor = document.createElement('textarea');
                viewTextEditor.value = doc.content || 'No content available.';
                viewTextEditor.readOnly = true;
                elements.viewEditorContainer.appendChild(viewTextEditor);
                console.log('Text content:', doc.content);
            }
            elements.viewOverlay.classList.add('show');
        }

        function hideViewDocumentModal() {
            elements.viewOverlay.classList.remove('show');
            if (viewHotInstance) {
                try {
                    viewHotInstance.destroy();
                } catch (e) {
                    console.warn('Error destroying viewHotInstance:', e);
                }
                viewHotInstance = null;
            }
            if (viewTextEditor) {
                elements.viewEditorContainer.removeChild(viewTextEditor);
                viewTextEditor = null;
            }
        }

        async function createDocument(event) {
            event.preventDefault();
            if (!config.userId) {
                showErrorAlert('User not authenticated.');
                return;
            }
            const name = elements.docName.value.trim();
            const type = elements.docType.value;
            let content = null;
            if (!name) {
                showErrorAlert('Please enter a document name.');
                return;
            }
            if (type === 'XLS') {
                if (!hotInstance) {
                    showErrorAlert('Excel editor not initialized.');
                    return;
                }
                content = hotInstance.getData();
                if (content.length === 0 || content.every(row => row.every(cell => !cell))) {
                    showErrorAlert('Please enter some data in the Excel sheet.');
                    return;
                }
            } else {
                if (!textEditor) {
                    showErrorAlert('Text editor not initialized.');
                    return;
                }
                content = textEditor.value.trim();
                if (!content) {
                    showErrorAlert('Please enter text content.');
                    return;
                }
            }
            try {
                const response = await fetchWithTimeout(`${config.apiBase}/createDocument`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'userId': config.userId
                    },
                    body: JSON.stringify({ name, type, userId: config.userId, content })
                });
                if (!response.ok) {
                    const text = await response.text();
                    console.error('API error response:', text);
                    throw new Error(`HTTP error! status: ${response.status}, response: ${text}`);
                }
                const newDoc = await response.json();
                console.log('Created document:', newDoc);
                if (!Array.isArray(documents)) {
                    documents = [];
                }
                newDoc.type = normalizeDocType(newDoc.type);
                documents.push(newDoc);
                populateDocuments();
                hideCreateDocumentModal();
                showSuccessAlert('Document created successfully!');
            } catch (error) {
                console.error('Error creating document:', error);
                showErrorAlert(`Failed to create document: ${error.message}`);
            }
        }

        function showCreateDocumentModal() {
            console.log('Showing create document modal, type:', elements.docType.value);
            elements.createOverlay.classList.add('show');
            elements.editorContainer.innerHTML = '';
            const docType = elements.docType.value;
            if (hotInstance) {
                try {
                    hotInstance.destroy();
                } catch (e) {
                    console.warn('Error destroying hotInstance:', e);
                }
                hotInstance = null;
            }
            if (textEditor) {
                elements.editorContainer.removeChild(textEditor);
                textEditor = null;
            }
            if (docType === 'XLS') {
                const hotContainer = document.createElement('div');
                elements.editorContainer.appendChild(hotContainer);
                try {
                    hotInstance = new Handsontable(hotContainer, {
                        data: Handsontable.helper.createSpreadsheetData(10, 10),
                        rowHeaders: true,
                        colHeaders: true,
                        contextMenu: true,
                        width: '100%',
                        height: '100%',
                        stretchH: 'all',
                        licenseKey: 'non-commercial-and-evaluation'
                    });
                    console.log('Handsontable initialized for create modal');
                } catch (e) {
                    console.error('Error initializing Handsontable:', e);
                    showErrorAlert('Failed to initialize Excel editor.');
                }
            } else {
                textEditor = document.createElement('textarea');
                elements.editorContainer.appendChild(textEditor);
                console.log('Textarea initialized for create modal');
            }
        }

        function hideCreateDocumentModal() {
            elements.createOverlay.classList.remove('show');
            elements.docName.value = '';
            if (hotInstance) {
                try {
                    hotInstance.destroy();
                } catch (e) {
                    console.warn('Error destroying hotInstance:', e);
                }
                hotInstance = null;
            }
            if (textEditor) {
                elements.editorContainer.removeChild(textEditor);
                textEditor = null;
            }
        }

        function updateDocTypeChart() {
            const types = documents.reduce((acc, doc) => {
                acc[doc.type] = (acc[doc.type] || 0) + 1;
                return acc;
            }, {});
            const docTypeCtx = document.getElementById('docTypeChart').getContext('2d');
            if (docTypeChartInstance) {
                docTypeChartInstance.destroy();
                docTypeChartInstance = null;
            }
            docTypeChartInstance = new Chart(docTypeCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(types),
                    datasets: [{ label: 'Documents', data: Object.values(types), backgroundColor: '#007bff' }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
            console.log('Updated docTypeChart:', types);
        }

        // Event Listeners
        elements.errorOverlay.querySelector('#errorOkBtn').addEventListener('click', () => {
            elements.errorOverlay.classList.remove('show');
        });

        elements.successOverlay.querySelector('#successOkBtn').addEventListener('click', () => {
            elements.successOverlay.classList.remove('show');
        });

        document.getElementById('createDocumentBtn').addEventListener('click', showCreateDocumentModal);

        document.getElementById('createDocCancelBtn').addEventListener('click', hideCreateDocumentModal);

        document.getElementById('createDocumentForm').addEventListener('submit', createDocument);

        elements.docType.addEventListener('change', showCreateDocumentModal);

        document.getElementById('viewDocCloseBtn').addEventListener('click', hideViewDocumentModal);

        window.addEventListener('load', () => {
            initializeCharts();
            fetchDocuments();
        });
    </script>
</body>
</html>
