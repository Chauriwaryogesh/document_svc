<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Panel - User Management</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<style>
		/* Bubble Theme Styles */
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			margin: 0;
			background: linear-gradient(135deg, #e0f7fa, #c5e1a5);
			color: #333;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 30px;
			min-height: 100vh;
		}

		h1 {
			color: #007bff;
			margin-bottom: 30px;
			animation: fadeInDown 0.5s ease-out;
		}

		@keyframes fadeInDown {
			from {
				opacity: 0;
				transform: translateY(-20px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.header-actions {
			width: 80%;
			max-width: 900px;
			display: flex;
			justify-content: flex-end;
			gap: 15px;
			margin-bottom: 20px;
		}

		.header-actions button {
			background-color: #fff;
			color: #007bff;
			border: 1px solid #007bff;
			padding: 10px 15px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 0.9em;
			transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.2s ease;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
		}

		.header-actions button:hover {
			background-color: #007bff;
			color: white;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
		}

		.user-list-container {
			width: 80%;
			max-width: 900px;
			background-color: #fff;
			border-radius: 12px;
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
			padding: 25px;
			animation: fadeInUp 0.5s ease-out;
		}

		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(20px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.user-summary {
			display: flex;
			align-items: center;
			padding: 15px;
			border-bottom: 1px solid #eee;
			cursor: pointer;
			transition: background-color 0.3s ease;
			animation: slideInLeft 0.3s ease-out forwards;
			opacity: 0;
			transform: translateX(-10px);
		}

		@keyframes slideInLeft {
			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		.user-summary:last-child {
			border-bottom: none;
		}

		.user-summary:hover {
			background-color: #f9f9f9;
		}

		.user-summary .arrow {
			margin-left: 10px;
			transition: transform 0.3s ease;
		}

		.user-summary.active .arrow {
			transform: rotate(90deg);
		}

		.user-details {
			padding: 15px;
			border-bottom: 1px solid #ddd;
			display: none;
			/* Initially hidden */
			grid-template-columns: 1fr 1fr;
			gap: 15px 20px;
			animation: expandDetails 0.3s ease-out forwards;
			overflow: hidden;
			/* Prevent content overflow during animation */
		}

		@keyframes expandDetails {
			from {
				opacity: 0;
				height: 0;
				padding: 0 15px;
			}

			to {
				opacity: 1;
				height: auto;
				padding: 15px;
			}
		}

		.user-details:last-child {
			border-bottom: none;
		}

		.user-details>div {
			display: flex;
			flex-direction: column;
		}

		.user-details label {
			font-weight: bold;
			color: #555;
			margin-bottom: 5px;
			font-size: 0.9em;
		}

		.user-details input[type="text"],
		.user-details input[type="date"] {
			padding: 8px;
			border: 1px solid #ccc;
			border-radius: 6px;
			font-size: 0.95em;
		}

		.user-details input[type="checkbox"] {
			margin-right: 5px;
		}

		.user-details .checkbox-group {
			display: flex;
			align-items: center;
		}

		/* Updated button container */
		.button-container {
			margin-top: 30px;
			animation: pulse 1.5s ease-in-out infinite alternate;
			display: flex;
			justify-content: flex-end;
			/* Align items to the right */
			gap: 15px;
			/* Space between buttons */
			width: 80%;
			/* Match user list width */
			max-width: 900px;
		}

		.button-container button {
			padding: 12px 25px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 1em;
			transition: background-color 0.3s ease, box-shadow 0.2s ease;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
		}

		.button-container button:hover {
			box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
		}

		.button-container button:first-child {
			/* Style for the "Create New User" button */
			background-color: #007bff;
			/* Blue color */
			color: white;
			border: none;
		}

		.button-container button:first-child:hover {
			background-color: #0056b3;
		}

		/* New User Modal Styles */
		.new-user-modal {
			display: none;
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background-color: #fff;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
			z-index: 1002;
			width: 80%;
			max-width: 400px;
		}

		.new-user-modal h2 {
			color: #007bff;
			margin-bottom: 15px;
		}

		.new-user-modal .modal-content>div {
			margin-bottom: 10px;
		}

		.new-user-modal label {
			display: block;
			font-weight: bold;
			color: #555;
			margin-bottom: 5px;
			font-size: 0.9em;
		}

		.new-user-modal input[type="text"],
		.new-user-modal input[type="date"],
		.new-user-modal input[type="checkbox"] {
			padding: 8px;
			border: 1px solid #ccc;
			border-radius: 6px;
			font-size: 0.95em;
			width: 100%;
			box-sizing: border-box;
		}

		.new-user-modal .checkbox-group {
			display: flex;
			align-items: center;
		}

		.new-user-modal .checkbox-group input[type="checkbox"] {
			margin-right: 5px;
		}

		.new-user-modal .modal-buttons {
			display: flex;
			justify-content: flex-end;
			gap: 10px;
			margin-top: 20px;
		}

		.new-user-modal .modal-buttons button {
			padding: 10px 15px;
			border-radius: 6px;
			cursor: pointer;
			font-size: 0.9em;
		}

		.new-user-modal .modal-buttons .save-button {
			background-color: #28a745;
			color: white;
			border: none;
		}

		.new-user-modal .modal-buttons .cancel-button {
			background-color: #dc3545;
			color: white;
			border: none;
		}

		.overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5);
			z-index: 1001;
		}

		#popup-message {
			display: none;
			/* position: fixed; Remove this */
			/* top: 20px; Remove this */
			/* left: 50%; Remove this */
			/* transform: translateX(-50%); Remove this */
			background-color: #4CAF50;
			/* Success green */
			color: white;
			padding: 15px 25px;
			border-radius: 8px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
			z-index: 1001;
			opacity: 0;
			animation: slideInTop 0.3s ease-out forwards, fadeOut 0.3s ease-in 3s forwards;
			margin-top: 10px;
			/* Add some space above */
			/* You might need to adjust left/right margins for centering */
		}

		.required {
			color: red;
			margin-left: 5px;
		}
		/* Style for the Settings button in your header-actions */
		.header-actions button:nth-child(3) { /* Assuming "Settings" is the 3rd button */
		    /* You can keep your existing styles or add specific ones here */
		}

		/* Styles for the setting popup */
		.setting-popup {
		    text-align: left; /* Align text within the popup to the left */
		}

		.setting-content h3 {
		    text-align: center; /* Center the title */
		    color: #007bff;
		    margin-bottom: 15px;
		}

		.setting-content ul {
		    list-style: none;
		    padding: 0;
		    margin: 0;
		}

		.setting-content li {
		    padding: 10px 0;
		    border-bottom: 1px solid #eee;
		}

		.setting-content li:last-child {
		    border-bottom: none;
		}

		.setting-content a {
		    text-decoration: none;
		    color: #333;
		    display: block;
		}

		.setting-content i {
		    margin-right: 10px;
		    color: #007bff;
		}

		.close-button {
		    position: absolute;
		    top: 5px;
		    right: 10px;
		    font-size: 1em;
		    font-weight: bold;
		    color: #aaa;
		    cursor: pointer;
		    border: none;
		    background: none;
		    padding: 0;
		}

		.close-button:hover {
		    color: #333;
		}

		#settingOverlay {
		    display: none;
		    position: fixed;
		    top: 0;
		    left: 0;
		    width: 100%;
		    height: 100%;
		    background-color: rgba(0, 0, 0, 0.5);
		    z-index: 1002;
		}
		
	</style>
</head>

<body>
	<h1><i class="fas fa-users"></i> User Management Panel</h1>
	<div id="popup-message"></div>
			<div class="header-actions">
		<button onclick="openContactPopup()">
			<i class="fas fa-envelope"></i> Contact Us
		</button>
		<button><i class="fas fa-bell"></i> Notifications</button>
		<button onclick="toggleSettingPopup()">
			<i class="fas fa-envelope"></i> Settings
		</button>
		<button onclick="logoutUser()" style="background-color: #fff; color: #dc3545; border: 1px solid #dc3545; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.2s ease; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);">
		    <i class="fas fa-sign-out-alt"></i> Logout
		</button>
	</div>
	<div class="contact-popup" id="contactPopup"
		style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); z-index: 1003; text-align: center;">
		<div class="contact-content">
			<button class="close-button" onclick="closeContactPopup()"
				style="position: absolute; top: 10px; right: 15px; font-size: 1.5em; font-weight: bold; color: #aaa; cursor: pointer; border: none; background: none; padding: 0;">&times;</button>
			<h3>Contact Information</h3>
			<p style="margin-bottom: 15px; font-size: 1em; color: #555;"><i class="fas fa-envelope"
					style="margin-right: 8px; color: #007bff;"></i> Email: Chauriwaryogesh@gmail.com</p>
			<p style="margin-bottom: 15px; font-size: 1em; color: #555;"><i class="fas fa-phone"
					style="margin-right: 8px; color: #007bff;"></i> Phone: 8208247944 (Mon to Fri, 24/7)</p>
		</div>
	</div>

	<div class="overlay" id="openSettingPopup"
		style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1002;">
	</div>

	<div class="setting-popup" id="settingPopup"
	    style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); z-index: 1003; text-align: left; min-width: 200px;">
	    <div class="setting-content">
	        <button class="close-button" onclick="toggleSettingPopup()"
	            style="position: absolute; top: 5px; right: 10px; font-size: 1em; font-weight: bold; color: #aaa; cursor: pointer; border: none; background: none; padding: 0;">&times;</button>
	        <h3 style="color: #007bff; margin-bottom: 15px; text-align: center;">Settings</h3>
	        <ul style="list-style: none; padding: 0; margin: 0;">
	            <li style="padding: 10px 0; border-bottom: 1px solid #eee;">
	                <a href="#" style="text-decoration: none; color: #333; display: block;"><i class="fas fa-user" style="margin-right: 10px; color: #007bff;"></i> Profile</a>
	            </li>
	            <li style="padding: 10px 0; border-bottom: 1px solid #eee;">
	                <a href="#" style="text-decoration: none; color: #333; display: block;"><i class="fas fa-cog" style="margin-right: 10px; color: #007bff;"></i> My Settings</a>
	            </li>
	            <li style="padding: 10px 0; border-bottom: 1px solid #eee;">
	                <a href="#" style="text-decoration: none; color: #333; display: block;"><i class="fas fa-bell" style="margin-right: 10px; color: #007bff;"></i> Notifications</a>
	            </li>
	            <li style="padding: 10px 0;">
	                <a href="#" style="text-decoration: none; color: #333; display: block;"><i class="fas fa-sliders-h" style="margin-right: 10px; color: #007bff;"></i> Preferences</a>
	            </li>
	        </ul>
	    </div>
	</div>

	<div class="overlay" id="settingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1002;"></div>


	<div class="overlay" id="contactOverlay"
		style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1002;">
	</div>


	<div class="user-list-container" id="userListContainer">
		<div class="loading-message">Loading users... <i class="fas fa-spinner fa-spin"></i></div>
	</div>
	<div id="popup-message">Changes saved successfully!</div>
	<div class="button-container">
		<button onclick="openNewUserModal()" class="create-user-button"><i class="fas fa-plus"></i> Create New
			User</button>
		<button onclick="saveChanges()"><i class="fas fa-save"></i> Save Changes</button>
	</div>
	<div class="new-user-modal" id="newUserModal">
		<h2>Create New User</h2>
		<div class="modal-content">
			<div>
				<label for="new-email">Email<span class="required">*</span></label>
				<input type="text" id="new-email">
			</div>
			<div>
				<label for="new-userCode">User Code<span class="required">*</span></label>
				<input type="text" id="new-userCode">
			</div>
			<div>
				<label>Email Verified</label>
				<div class="checkbox-group">
					<input type="checkbox" id="new-isEmailVerified">
					<label for="new-isEmailVerified">Yes</label>
				</div>
			</div>
			<div>
				<label>User Code Verified</label>
				<div class="checkbox-group">
					<input type="checkbox" id="new-isUserCodeVerified">
					<label for="new-isUserCodeVerified">Yes</label>
				</div>
			</div>
			<div>
				<label for="new-remainingTime">Expiry Time<span class="required">*</span></label>
				<input type="date" id="new-remainingTime">
			</div>
		</div>
		<div class="modal-buttons">
			<button class="save-button" onclick="saveNewUser()">Save</button>
			<button class="cancel-button" onclick="closeNewUserModal()">Cancel</button>

		</div>
	</div>

	<div class="overlay" id="modalOverlay"></div>

	<footer class="main-footer">
		Access Management Control
	</footer>

	<script>
		function logoutUser() {
		    window.location.href = 'login';
		}
		function openNewUserModal() {
			document.getElementById('newUserModal').style.display = 'block';
			document.getElementById('modalOverlay').style.display = 'block';
		}
		async function fetchWorkItems() {
			const apiUrl = 'http://localhost:8081/Security/user-list';
			const userId = "ychouri";
			const userListContainer = document.getElementById('userListContainer');
			userListContainer.innerHTML = '<div class="loading-message">Loading users... <i class="fas fa-spinner fa-spin"></i></div>';

			try {
				const response = await fetch(apiUrl, {
					method: 'GET',
					headers: {
						'userId': userId
					}
				});

				if (!response.ok) {
					console.error(`HTTP error! status: ${response.status}`);
					userListContainer.innerHTML = '<div class="error-message">Error loading users.</div>';
					return;
				}

				const data = await response.json();
				console.log('API Data:', data);
				populateUserList(data.data);

			} catch (error) {
				console.error('Error fetching work items:', error);
				userListContainer.innerHTML = '<div class="error-message">Error loading users.</div>';
			}
		}

		function populateUserList(workItems) {
			const userListContainer = document.getElementById('userListContainer');
			userListContainer.innerHTML = '';

			workItems.forEach((item, index) => {
				const userSummary = document.createElement('div');
				userSummary.classList.add('user-summary');
				userSummary.style.animationDelay = `${index * 0.1}s`;
				userSummary.innerHTML = `
                    <strong>User ID: ${item.id}</strong>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                `;
				userSummary.addEventListener('click', () => toggleUserDetails(item.id));
				userListContainer.appendChild(userSummary);

				const userDetails = document.createElement('div');
				userDetails.classList.add('user-details');
				userDetails.dataset.userId = item.id;
				userDetails.innerHTML = `
                    <div>
                        <label for="email-${item.id}">Email</label>
                        <input type="text" id="email-${item.id}" value="${item.email === null ? '' : item.email}" data-user-id="${item.id}" data-field="email">
                    </div>
                    <div>
                        <label for="userCode-${item.id}">User Code</label>
                        <input type="text" id="userCode-${item.id}" value="${item.userCode === null ? '' : item.userCode}" data-user-id="${item.id}" data-field="userCode">
                    </div>
                    <div>
                        <label>Email Verified</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="isEmailVerified-${item.id}" ${item.isEmailVerified === 'Y' ? 'checked' : ''} data-user-id="${item.id}" data-field="isEmailVerified">
                            <label for="isEmailVerified-${item.id}">Yes</label>
                        </div>
                    </div>
                    <div>
                        <label>User Code Verified</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="isUserCodeVerified-${item.id}" ${item.isUserCodeVerified === 'Y' ? 'checked' : ''} data-user-id="${item.id}" data-field="isUserCodeVerified">
                            <label for="isUserCodeVerified-${item.id}">Yes</label>
                        </div>
                    </div>
                    <div>
                        <label for="remainingTime-${item.id}">Expiry Time</label>
                        <input type="date" id="remainingTime-${item.id}" value="${item.remainingTime === null ? '' : item.remainingTime.split('T')[0]}" data-user-id="${item.id}" data-field="remainingTime">
                    </div>
                    <div>
                        <label>ID</label>
                        <div>${item.id}</div>
                    </div>
                `;
				userListContainer.appendChild(userDetails);
			});
		}

		function toggleUserDetails(userId) {
			const detailsElement = document.querySelector(`.user-details[data-user-id="${userId}"]`);
			const summaryElement = Array.from(document.querySelectorAll('.user-summary')).find(summary => summary.textContent.includes(`User ID: ${userId}`));
			if (detailsElement) {
				detailsElement.style.display = detailsElement.style.display === 'grid' ? 'none' : 'grid';
			}
			if (summaryElement && summaryElement.querySelector('.arrow')) {
				summaryElement.classList.toggle('active');
			}
		}

		async function saveChanges() {
			const visibleDetails = document.querySelector('.user-details[style*="display: grid;"]');

			if (visibleDetails) {
				const userId = visibleDetails.dataset.userId;
				const updatedUser = {id: parseInt(userId)};

				const emailInput = visibleDetails.querySelector('[data-field="email"]');
				if (emailInput) updatedUser.email = emailInput.value;

				const userCodeInput = visibleDetails.querySelector('[data-field="userCode"]');
				if (userCodeInput) updatedUser.userCode = userCodeInput.value;

				const isEmailVerifiedInput = visibleDetails.querySelector('[data-field="isEmailVerified"]');
				if (isEmailVerifiedInput) updatedUser.isEmailVerified = isEmailVerifiedInput.checked ? 'Y' : 'N';

				const isUserCodeVerifiedInput = visibleDetails.querySelector('[data-field="isUserCodeVerified"]');
				if (isUserCodeVerifiedInput) updatedUser.isUserCodeVerified = isUserCodeVerifiedInput.checked ? 'Y' : 'N';

				const remainingTimeInput = visibleDetails.querySelector('[data-field="remainingTime"]');
				if (remainingTimeInput) updatedUser.remainingTime = remainingTimeInput.value;

				console.log('Data to be saved:', updatedUser);
				await sendUpdatedData(updatedUser); // Send a single user object
			} else {
				alert('Please expand a user\'s details to save.');
			}
		}

		async function sendUpdatedData(updatedUser) {
			const saveApiUrl = 'http://localhost:8081/Security/add-user';

			try {
				const response = await fetch(saveApiUrl, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'userId': "SYSTEM"
					},
					body: JSON.stringify(updatedUser) // Sending a single user object
				});

				if (response.ok) {
					const result = await response.json();
					console.log('Changes saved successfully:', result);
					showPopupMessage();
					fetchWorkItems(); // Reload to reflect changes
				} else {
					console.error('Error saving changes:', response.status);
					alert('Error saving changes.');
				}

			} catch (error) {
				console.error('Error sending updated data:', error);
				alert('Error saving changes.');
			}
		}
		async function saveNewUser() {
			const newEmail = document.getElementById('new-email').value.trim();
			const newUserCode = document.getElementById('new-userCode').value.trim();
			const isEmailVerified = document.getElementById('new-isEmailVerified').checked ? 'Y' : 'N';
			const isUserCodeVerified = document.getElementById('new-isUserCodeVerified').checked ? 'Y' : 'N';
			const remainingTime = document.getElementById('new-remainingTime').value;

			if (!newEmail) {
				showPopupMessage('Email is required.');
				return; // Stop the function from proceeding
			}

			if (!newUserCode) {
				showPopupMessage('User Code is required.');
				return; // Stop the function from proceeding
			}

			const newUser = {
				email: newEmail,
				userCode: newUserCode,
				isEmailVerified: isEmailVerified,
				isUserCodeVerified: isUserCodeVerified,
				remainingTime: remainingTime
			};

			console.log('New user data:', newUser);
			await sendNewUserData(newUser);
		}
		function closeNewUserModal() {
			document.getElementById('newUserModal').style.display = 'none';
			document.getElementById('modalOverlay').style.display = 'none';
			resetNewUserForm();
		}
		async function sendNewUserData(newUser) {
			const saveApiUrl = 'http://localhost:8081/Security/add-user'; // Your add user API endpoint

			try {
				const response = await fetch(saveApiUrl, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'userId': "SYSTEM" // Or your required user ID for creating new users
					},
					body: JSON.stringify(newUser)
				});

				if (response.ok) {
					const result = await response.json();
					console.log('New user created successfully:', result);
					showPopupMessage('New user created successfully!');
					closeNewUserModal();
					fetchWorkItems(); // Reload user list
				} else {
					const errorData = await response.json();
					console.error('Error creating new user:', response.status, errorData);
					showPopupMessage(`Error creating new user: ${errorData.message || 'Something went wrong.'}`);
				}

			} catch (error) {
				console.error('Error sending new user data:', error);
				showPopupMessage('Error creating new user.');
			}
		}

		function showPopupMessage(message) {
			const popup = document.getElementById('popup-message');
			popup.textContent = message;
			popup.style.display = 'block';
			setTimeout(() => {
				popup.style.display = 'none';
			}, 3500);
		}
		function resetNewUserForm() {
			document.getElementById('new-email').value = '';
			document.getElementById('new-userCode').value = '';
			document.getElementById('new-isEmailVerified').checked = false;
			document.getElementById('new-isUserCodeVerified').checked = false;
			document.getElementById('new-remainingTime').value = '';
		}
		function showPopupMessage() {
			const popup = document.getElementById('popup-message');
			popup.style.display = 'block';
			setTimeout(() => {
				popup.style.display = 'none';
			}, 3500);
		}

		function openContactPopup() {
			document.getElementById('contactPopup').style.display = 'block';
			document.getElementById('contactOverlay').style.display = 'block';
		}

		function closeContactPopup() {
			document.getElementById('contactPopup').style.display = 'none';
			document.getElementById('contactOverlay').style.display = 'none';
		}
		function toggleSettingPopup() {
		    const settingPopup = document.getElementById('settingPopup');
		    const settingOverlay = document.getElementById('settingOverlay');
		    settingPopup.style.display = settingPopup.style.display === 'none' ? 'block' : 'none';
		    settingOverlay.style.display = settingOverlay.style.display === 'none' ? 'block' : 'none';
		}

		window.onload = fetchWorkItems;
	</script>
